name: V5 Futures Signal Autopilot (Quarantined by V18.2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-and-build:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy V5 signal and dashboard path is disabled
        run: |
          echo "V5_SIGNAL_AUTOPILOT=QUARANTINED"
          echo "DASHBOARD_PUBLICATION=DISABLED"
          echo "TELEGRAM_DELIVERY=DISABLED"
