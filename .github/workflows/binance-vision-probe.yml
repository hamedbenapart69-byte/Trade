name: Binance Vision Historical Futures Data Probe

on:
  push:
    branches: [ops/binance-vision-probe-20261120]
    paths:
      - "docs/evidence/run-binance-vision-probe*.txt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit two-year archive index coverage for six symbols
        shell: bash
        run: |
          set -euo pipefail
          audit_prefix() {
            local label="$1"
            local prefix="$2"
            local start_after="$3"
            local expected="$4"
            local token=""
            local count=0
            local pages=0
            local first=""
            local last=""
            while :; do
              local xml
              if [[ -z "$token" ]]; then
                xml="$(curl --fail --silent --show-error --location --retry 2 --get \
                  --data-urlencode "list-type=2" --data-urlencode "prefix=$prefix" \
                  --data-urlencode "start-after=$start_after" \
                  "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision")"
              else
                xml="$(curl --fail --silent --show-error --location --retry 2 --get \
                  --data-urlencode "list-type=2" --data-urlencode "prefix=$prefix" \
                  --data-urlencode "continuation-token=$token" \
                  "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision")"
              fi
              local keys
              keys="$(printf '%s' "$xml" | grep -oE '<Key>[^<]+' | sed 's/<Key>//' | grep -v '\.CHECKSUM$' || true)"
              local page_count
              page_count="$(printf '%s\n' "$keys" | sed '/^$/d' | wc -l)"
              if [[ -z "$first" && -n "$keys" ]]; then first="$(printf '%s\n' "$keys" | sed -n '1p')"; fi
              if [[ -n "$keys" ]]; then last="$(printf '%s\n' "$keys" | tail -n 1)"; fi
              count=$((count + page_count))
              pages=$((pages + 1))
              local truncated
              truncated="$(printf '%s' "$xml" | grep -oE '<IsTruncated>[^<]+' | sed 's/<IsTruncated>//' || true)"
              if [[ "$truncated" != "true" ]]; then break; fi
              token="$(printf '%s' "$xml" | grep -oE '<NextContinuationToken>[^<]+' | sed 's/<NextContinuationToken>//' | sed 's/&amp;/\&/g' || true)"
              if [[ -z "$token" ]]; then echo "INDEX_PAGINATION_TOKEN_MISSING label=$label"; return 1; fi
            done
            echo "ARCHIVE_INDEX label=$label count=$count expected=$expected pages=$pages first=$first last=$last"
            if [[ "$count" -ne "$expected" ]]; then echo "ARCHIVE_INDEX_COVERAGE_FAIL label=$label"; return 1; fi
          }
          expected_daily=$(( ( $(date -u -d 2026-11-19 +%s) - $(date -u -d 2024-11-20 +%s) ) / 86400 + 1 ))
          for symbol in BTCUSDT ETHUSDT BNBUSDT UNIUSDT ARBUSDT WLDUSDT; do
            audit_prefix "${symbol}_METRICS_5M" \
              "data/futures/um/daily/metrics/${symbol}/" \
              "data/futures/um/daily/metrics/${symbol}/${symbol}-metrics-2024-11-18.zip.CHECKSUM" \
              "$expected_daily"
            audit_prefix "${symbol}_FUNDING_MONTHLY" \
              "data/futures/um/monthly/fundingRate/${symbol}/" \
              "data/futures/um/monthly/fundingRate/${symbol}/${symbol}-fundingRate-2024-10.zip.CHECKSUM" 24
            audit_prefix "${symbol}_FUTURES_1H_MONTHLY" \
              "data/futures/um/monthly/klines/${symbol}/1h/" \
              "data/futures/um/monthly/klines/${symbol}/1h/${symbol}-1h-2024-10.zip.CHECKSUM" 24
            audit_prefix "${symbol}_SPOT_1H_MONTHLY" \
              "data/spot/monthly/klines/${symbol}/1h/" \
              "data/spot/monthly/klines/${symbol}/1h/${symbol}-1h-2024-10.zip.CHECKSUM" 24
          done
      - name: Verify public archive access, checksums and historical coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/binance-vision
          cd /tmp/binance-vision
          fetch_verify() {
            local relative="$1"
            local filename="${relative##*/}"
            echo "PROBE_URL=https://data.binance.vision/${relative}"
            curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              "https://data.binance.vision/${relative}" -o "$filename"
            curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
              "https://data.binance.vision/${relative}.CHECKSUM" -o "$filename.CHECKSUM"
            sha256sum -c "$filename.CHECKSUM"
            unzip -l "$filename" | tail -n 3
            echo "ARCHIVE_PASS=$filename BYTES=$(stat -c%s "$filename")"
          }
          fetch_verify "data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-2025-01-01.zip"
          fetch_verify "data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-2026-11-18.zip"
          fetch_verify "data/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2025-01.zip"
          fetch_verify "data/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2026-10.zip"
          fetch_verify "data/futures/um/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2025-01.zip"
          unzip -p BTCUSDT-metrics-2025-01-01.zip | sed -n '1,3p'
          unzip -p BTCUSDT-fundingRate-2025-01.zip | sed -n '1,3p'
          echo "ALTCOIN_ARCHIVE_PROBE_BEGIN"
          failures=0
          for symbol in ETHUSDT BNBUSDT UNIUSDT ARBUSDT WLDUSDT; do
            for relative in \
              "data/futures/um/daily/metrics/${symbol}/${symbol}-metrics-2025-01-01.zip" \
              "data/futures/um/daily/metrics/${symbol}/${symbol}-metrics-2026-11-18.zip" \
              "data/futures/um/monthly/fundingRate/${symbol}/${symbol}-fundingRate-2025-01.zip" \
              "data/futures/um/monthly/klines/${symbol}/1h/${symbol}-1h-2025-01.zip" \
              "data/spot/monthly/klines/${symbol}/1h/${symbol}-1h-2025-01.zip"; do
              if fetch_verify "$relative"; then
                echo "ALTCOIN_ARCHIVE_AVAILABLE=${relative}"
              else
                echo "ALTCOIN_ARCHIVE_UNAVAILABLE=${relative}"
                failures=$((failures+1))
              fi
            done
          done
          echo "ALTCOIN_ARCHIVE_FAILURE_COUNT=${failures}"
          echo "BINANCE_VISION_PROBE_PASS"

          echo "ACTIONS_ARTIFACT_UPLOAD_DISABLED=true"
