name: C++ Foundation

on:
  push:
    branches: [main, feat/cpp-core, feat/cpp-stage6-meta-calibration-v1]
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-foundation.yml"
  pull_request:
    branches: [main]
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libcurl4-openssl-dev nlohmann-json3-dev libssl-dev
      - name: Record toolchain
        run: |
          cmake --version
          g++ --version
          pkg-config --modversion libcurl openssl
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run unit tests
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error
          ./build/cfss_unit_tests
      - name: V21.1 live market-wide aggregator probe
        if: startsWith(github.head_ref, 'v21.1/')
        env:
          COINRANKING_API_KEY: ${{ secrets.COINRANKING_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          ./build/provider_federation_probe artifacts/provider-federation-discovery.v1.json
          probe_status=$?
          set -e
          cat artifacts/provider-federation-discovery.v1.json
          if [ "$probe_status" -ne 0 ]; then
            echo "V21_1_PROVIDER_PROBE_FAILED exit=$probe_status"
            exit "$probe_status"
          fi
          jq -e '
            .schema_version == "1.0.0" and
            .status == "TWO_FRESH_LICENSE_ELIGIBLE_PROVIDERS_FULL_NINE_ASSET_MATCH" and
            .production_eligible_fresh_provider_count >= 2 and
            .matched_asset_count == 9 and .required_asset_count == 9 and
            ([.candidate_seed[] | select(.classification == "TWO_SOURCE_IDENTITY_MATCHED" and .matched_provider_pair == "coinranking+coinpaprika")] | length) == 9
          ' artifacts/provider-federation-discovery.v1.json >/dev/null
          echo "V21_1_TWO_LICENSE_ELIGIBLE_PROVIDERS_FULL_NINE_ASSET_PASS"

      - name: Verify market pipeline requires an explicit L1 contract or live collection command
        run: |
          if ./build/market_pipeline >/tmp/market_pipeline_usage.log 2>&1; then
            echo "Unexpected zero-argument market pipeline success"
            exit 1
          fi
          grep -q "Usage: market_pipeline" /tmp/market_pipeline_usage.log
