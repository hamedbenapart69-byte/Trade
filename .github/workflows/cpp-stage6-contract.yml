name: C++ Stage 6 Calibration Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "cpp/**"
      - "contracts/**"
      - ".github/workflows/cpp-stage6-contract.yml"
      - ".github/workflows/cpp-stage6-meta-cognition-v1.yml"
      - ".github/workflows/cpp-stage1-live.yml"
  push:
    branches: [integration/stage6-meta-calibration-rebased]
    paths:
      - "cpp/**"
      - "contracts/**"
      - ".github/workflows/cpp-stage6-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage6-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage6-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ and schema dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libcurl4-openssl-dev nlohmann-json3-dev libssl-dev
      - name: Configure, compile, and run complete CTest
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error
      - name: Static policy guards
        run: |
          grep -Fq 'NOT_CALIBRATED' cpp/include/cfss/meta_calibration.hpp
          grep -Fq 'NOT_CALCULATED' cpp/include/cfss/meta_calibration.hpp
          grep -Fq 'closed_at_ms' cpp/include/cfss/meta_calibration.hpp
          grep -Fq 'NOT_EXECUTED' cpp/include/cfss/shadow_outcomes.hpp
          grep -Fq 'cost_status' cpp/include/cfss/shadow_outcomes.hpp
          grep -Fq 'fee_r' cpp/include/cfss/shadow_outcomes.hpp
          grep -Fq 'cp stage6-evidence/crypto-universe.v1.json signals-state/cpp_runtime/crypto_universe.v1.json' .github/workflows/cpp-stage6-meta-cognition-v1.yml
          grep -Fq 'gzip -n -9 -c stage6-evidence/liquidity-phase.v1.json' .github/workflows/cpp-stage6-meta-cognition-v1.yml
          grep -Fq 'gzip -t signals-state/cpp_runtime/liquidity_stage5_v1.json.gz' .github/workflows/cpp-stage6-meta-cognition-v1.yml
          grep -Fq 'liquidity_stage5_v1.json.sha256' .github/workflows/cpp-stage6-meta-cognition-v1.yml
          grep -Fq 'rm -f signals-state/cpp_runtime/liquidity_stage5_v1.json' .github/workflows/cpp-stage6-meta-cognition-v1.yml
          for schema in contracts/*.schema.json; do jq -e . "$schema" >/dev/null; done
          echo "ALL_SCHEMA_JSON_PARSE_PASS"
          echo "STAGE6_POLICY_GUARDS_PASS"
