name: FILUSDT Multi-Venue Archive Discovery
on:
  pull_request:
    paths:
      - "signal_autopilot/scripts/discover_filusdt_trade_venues.py"
      - "signal_autopilot/tests/test_discover_filusdt_trade_venues.py"
      - "signal_autopilot/modules/cryptohftdata_provider.py"
      - ".github/workflows/filusdt-venue-discovery.yml"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet dependency
        run: python -m pip install pyarrow
      - name: Run offline discovery tests
        run: |
          python -m unittest discover -s signal_autopilot/tests -p "test_discover_filusdt_trade_venues.py" -v
          python -m py_compile signal_autopilot/scripts/discover_filusdt_trade_venues.py
      - name: Discover exact FIL trade symbols across archive venues
        run: python signal_autopilot/scripts/discover_filusdt_trade_venues.py --output filusdt-venue-discovery.json
      - name: Upload symbol-coverage metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filusdt-multivenue-discovery
          path: filusdt-venue-discovery.json
          retention-days: 14
