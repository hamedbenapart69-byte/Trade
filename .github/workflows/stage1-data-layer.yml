name: Stage 1 Data Layer
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Number of active USDT perpetual symbols (BTC included)"
        required: true
        default: "100"
      years:
        description: "OHLCV and funding history years"
        required: true
        default: "2"
      probe_only:
        description: "Only test endpoint reachability; do not download history"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ccxt pyarrow
      - name: Probe and collect
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.probe_only }}" = "true" ]; then
            python scripts/run_stage1_data.py --probe-only
          else
            python scripts/run_stage1_data.py --symbols "${{ inputs.symbols }}" --years "${{ inputs.years }}"
          fi
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-data-layer-evidence
          path: data/stage1/
          if-no-files-found: warn
          retention-days: 30
