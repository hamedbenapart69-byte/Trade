name: Stage 1 Data Layer
on:
  push:
    branches: [stage-1-data-layer-v1]
  workflow_dispatch:
    inputs:
      symbols:
        description: "Number of active USDT perpetual symbols"
        required: true
        default: "100"
      years:
        description: "Historical coverage years"
        required: true
        default: "2"
      probe_only:
        description: "Only test endpoints; do not download historical data"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe or collect
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.event.head_commit.message }}" == *"[RUN_STAGE1_FULL]"* ]]; then
            python scripts/run_stage1_data.py --provider okx --symbols 100 --years 2
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.probe_only }}" = "true" ]; then
            python scripts/run_stage1_data.py --provider okx --probe-only
          else
            python scripts/run_stage1_data.py --provider okx --symbols "${{ inputs.symbols }}" --years "${{ inputs.years }}"
          fi
      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-data-layer-evidence
          path: data/stage1/
          if-no-files-found: warn
          retention-days: 30
