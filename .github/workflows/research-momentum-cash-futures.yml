name: Research - Momentum Cash USD-M Futures Backtest

on:
  push:
    branches:
      - v21.1/provider-federation-v1
    paths:
      - "research/momentum_cash_futures_backtest.py"
      - "research/momentum_cash_backtest.py"
      - "research/requirements.txt"
      - "tests/test_momentum_cash_backtest.py"
      - "tests/test_momentum_cash_futures_backtest.py"
      - ".github/workflows/research-momentum-cash-futures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  futures-backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic strategy unit tests
        run: python -m pytest -q tests/test_momentum_cash_backtest.py tests/test_momentum_cash_futures_backtest.py
      - name: Run USD-M perpetual backtest with verified funding
        run: python research/momentum_cash_futures_backtest.py
      - name: Validate evidence contract and output
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/momentum_cash_futures_results.json", encoding="utf-8"))
          assert d["research_status"] == "EXPLORATORY_NOT_APPROVED_FOR_TRADING"
          assert d["data"]["market"] == "USD_M_PERPETUAL"
          assert d["data"]["archive_integrity"] == "SHA256_CHECKSUM_VERIFIED_FOR_EVERY_DOWNLOADED_MONTHLY_ARCHIVE"
          assert len(d["data"]["fixed_tradable_assets"]) == 8
          assert d["strategy"]["acceptance_gate"]["status"] in {"PASS", "FAIL"}
          pbo = d["strategy"]["walk_forward"]["pbo"]
          assert pbo["status"] == "COMPUTED", pbo
          assert pbo["split_count"] == 70, pbo
          assert len(pbo["weekly_return_matrix"]) >= 32
          assert set(d["strategy"]["variant_comparison"]) == {"BTC_MA40", "BTC_MA50", "BTC_MA60"}
          assert d["strategy"]["risk_exit"]["trailing_stop_pct"] == 15.0
          assert d["strategy"]["risk_exit"]["asset_close_ma_exit_period"] == 20
          assert d["strategy"]["primary_version"] == "V3_MARKET_BREADTH_CONFIRMATION"
          assert d["strategy"]["v1_baseline"]["version"] == "V1_15PCT_TRAIL_PLUS_MA20_EXIT"
          assert d["strategy"]["acceptance_gate"]["status"] in {"PASS", "FAIL"}
          print("USD_M_FUTURES_RISK_PBO_EVIDENCE=VALID")
          print("OWNER_TARGETS", json.dumps(d["strategy"]["owner_targets"], sort_keys=True))
          print("CSCV_PBO", pbo["value"], "SPLITS", pbo["split_count"])
          PY
      - name: Upload full year-by-year and OOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-cash-usdm-futures-backtest
          path: artifacts/momentum_cash_futures_results.json
          if-no-files-found: warn
          retention-days: 30
