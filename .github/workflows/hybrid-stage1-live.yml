name: Hybrid Stage 1 Live L1-to-L2 Integration

on:
  push:
    branches: [feat/hybrid-stage1-live-run]
    paths:
      - "docs/evidence/run-live-l1-l2.txt"
      - ".github/workflows/hybrid-stage1-live.yml"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Bounded initial integration universe (10 is the default)"
        required: true
        default: "10"
        type: choice
        options: ["1", "5", "10"]
      years:
        description: "Historical OHLCV window in years"
        required: true
        default: "2"
        type: choice
        options: ["1", "2"]
      provider:
        description: "Primary public data provider"
        required: true
        default: "okx"
        type: choice
        options: ["okx", "binance"]

permissions:
  contents: read

jobs:
  live-l1-to-l2:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: hybrid-stage1-live-l1-l2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python L1 dependencies
        run: python -m pip install --disable-pip-version-check -r signal_autopilot/requirements.txt
      - name: Resolve safe integration defaults
        run: |
          echo "L1_PROVIDER=${{ inputs.provider || 'okx' }}" >> "$GITHUB_ENV"
          echo "L1_SYMBOLS=${{ inputs.symbols || '10' }}" >> "$GITHUB_ENV"
          echo "L1_YEARS=${{ inputs.years || '2' }}" >> "$GITHUB_ENV"
      - name: Acquire public data and export versioned L1 contract
        run: |
          python signal_autopilot/scripts/export_l1_contract.py \
            --provider "$L1_PROVIDER" \
            --symbols "$L1_SYMBOLS" \
            --years "$L1_YEARS" \
            --data-dir signal_autopilot/data/stage1-hybrid \
            --output artifacts/l1-market-data.v1.json
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libcurl4-openssl-dev nlohmann-json3-dev
      - name: Build C++20 L2 consumer
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run C++ L2 against real L1 artifact
        run: ./build/market_pipeline artifacts/l1-market-data.v1.json artifacts/l2-status.v1.json
      - name: Verify one safe C10 state per acquired instrument
        run: |
          python - <<'PY'
          import json
          with open("artifacts/l1-market-data.v1.json", encoding="utf-8") as f:
              l1 = json.load(f)
          with open("artifacts/l2-status.v1.json", encoding="utf-8") as f:
              l2 = json.load(f)
          allowed = {"BUY_NOW", "SELL_NOW", "CONDITIONAL_BUY", "CONDITIONAL_SELL",
                     "WATCHLIST", "NO_QUALIFIED_SETUP", "MARKET_DATA_DEGRADED"}
          source = {x["instrument_id"] for x in l1["instruments"]}
          outputs = l2["instruments"]
          expected = int(__import__("os").environ.get("L1_SYMBOLS", "10"))
          assert len(source) == expected, f"expected {expected} instruments, got {len(source)}"
          assert any(x["base"] == "BTC" for x in l1["instruments"]), "BTC context missing"
          assert len(outputs) == len(source), "L2 output count mismatch"
          assert {x["instrument_id"] for x in outputs} == source, "L2 instrument identity mismatch"
          assert all(x["state"] in allowed for x in outputs), "unknown C10 state"
          assert all(x["actionable"] is False for x in outputs), "Stage 1 must not emit actionable trades"
          print(json.dumps({"status":"PASS","l1_instruments":len(source),
                            "l2_states":{s:sum(x["state"]==s for x in outputs) for s in sorted(allowed)}},
                           ensure_ascii=False))
          PY
      - name: Upload real L1/L2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-stage1-l1-l2-${{ github.run_id }}
          path: |
            artifacts/
            signal_autopilot/data/stage1-hybrid/stage1_report.json
          if-no-files-found: warn
          retention-days: 14
