name: VTM Daily PIT Backtest 2023

on:
  push:
    branches:
      - stage-vtm-backtest-2023
    paths:
      - scripts/run_vtm_backtest_2023.py
      - .github/workflows/vtm-backtest-2023.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-vtm-backtest-2023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pandas numpy
      - name: Compile source
        run: python -m py_compile scripts/run_vtm_backtest_2023.py
      - name: Run VTM frozen-parameter backtest
        timeout-minutes: 10
        env:
          PIT_ARTIFACT_ID: '14772840217'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/run_vtm_backtest_2023.py
      - name: Validate final metrics artifact
        run: |
          python - <<'PY'
          import json
          p='results/vtm_backtest_2023/summary.json'
          x=json.load(open(p))
          m=x['metrics']
          assert m['total_trades'] >= 0
          assert 'pbo' in m and 'dsr_z' in m and 'max_drawdown' in m
          assert x['data']['archive_sha256_verified'] is True
          print('Metrics artifact validation: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vtm-backtest-2023-final
          path: results/vtm_backtest_2023/
          retention-days: 30
