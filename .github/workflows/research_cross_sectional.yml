name: Research - Full History Long Only 8 Assets

on:
  push:
    branches:
      - research/full-history-long-only-8-assets
    paths:
      - "research/cross_sectional_backtest.py"
      - ".github/workflows/research_cross_sectional.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Run full-history universe selection and three long-only tests
        shell: bash
        run: |
          set -euo pipefail
          python research/cross_sectional_backtest.py | tee full_history_long_only_results.json
          python -m json.tool full_history_long_only_results.json > /dev/null
          python - <<'PY'
          import json
          p = "full_history_long_only_results.json"
          d = json.load(open(p, encoding="utf-8"))
          assert len(d["data"]["selected_tradable_assets"]) == 8
          assert set(d["strategies"]) == {
              "PURE_MOMENTUM_LONG_TOP2",
              "PURE_MEAN_REVERSION_LONG_BOTTOM2",
              "HYBRID_BTC_MA50_SWITCH",
          }
          for name, item in d["strategies"].items():
              assert "year_by_year" in item and "entire_period" in item
          print("SCHEMA_AND_UNIVERSE_VALIDATION=PASS")
          PY
      - name: Upload raw JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-history-long-only-8-assets
          path: full_history_long_only_results.json
          if-no-files-found: error
          retention-days: 30
