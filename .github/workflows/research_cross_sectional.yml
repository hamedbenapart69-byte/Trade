name: Research - Cross-Sectional Backtest 2023-2024

on:
  push:
    branches:
      - research/cross-sectional-2023-2024
    paths:
      - "research/cross_sectional_backtest.py"
      - ".github/workflows/research_cross_sectional.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-sectional-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Run 2023 and 2024 cross-sectional experiments
        shell: bash
        run: |
          set -euo pipefail
          python research/cross_sectional_backtest.py | tee cross_sectional_backtest_results.json
          python -m json.tool cross_sectional_backtest_results.json > /dev/null
      - name: Upload raw JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: cross-sectional-backtest-2023-2024
          path: cross_sectional_backtest_results.json
          if-no-files-found: error
          retention-days: 30
