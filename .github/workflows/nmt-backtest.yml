name: NMT-1D Ichimoku Backtest
on:
  push:
    branches: [stage2-nmt-backtest]
    paths:
      - "scripts/run_nmt_backtest.py"
      - ".github/workflows/nmt-backtest.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: nmt1d-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backtest-guard and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/AgentJDrew/backtest-guard.git@317cd5a3d56063fd9d4bb8574401af30d9e55f46" pandas numpy scipy pyarrow
      - name: Verify statistical validator API
        run: |
          python - <<'PY'
          from backtest_guard import pbo, deflated_sharpe_ratio, PurgedKFold
          print("backtest-guard import PASS")
          print("PBO, DSR and PurgedKFold APIs available")
          PY
      - name: Download original 25-symbol OHLCV artifact
        uses: actions/download-artifact@v4
        with:
          name: binance-vision-1d-25-symbols-45055606760
          run-id: 45055606760
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data
      - name: Validate real OHLCV inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          symbols = ["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT","ADAUSDT","DOGEUSDT","AVAXUSDT","LINKUSDT","LTCUSDT","BCHUSDT","NEARUSDT","INJUSDT","UNIUSDT","FILUSDT","ARBUSDT","ENAUSDT","SUIUSDT","TAOUSDT","WLDUSDT","ZECUSDT","AAVEUSDT","QNTUSDT","RSRUSDT","ONEUSDT"]
          for symbol in symbols:
              p=Path("data")/f"{symbol}_1d.parquet"
              c=Path("data")/f"{symbol}_1d.csv"
              if p.exists(): d=pd.read_parquet(p)
              elif c.exists(): d=pd.read_csv(c)
              else: raise FileNotFoundError(symbol)
              assert len(d)==730, f"{symbol}: expected 730 rows, got {len(d)}"
          print("INPUT PASS: 25 symbols x 730 daily OHLCV rows")
          PY
      - name: Syntax and import checks
        run: python -m py_compile scripts/run_nmt_backtest.py
      - name: Run NMT-1D parameter sweep and walk-forward validation
        run: python scripts/run_nmt_backtest.py
      - name: Upload NMT results and LRT diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmt1d-backtest-results-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 30
