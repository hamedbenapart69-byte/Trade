name: Stage 1a Extended v3 - Full Binance USDT-M Universe

on:
  push:
    branches: [stage1a-extended-v3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1a-extended-v3-history
  cancel-in-progress: false

jobs:
  validate-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout v3 implementation
        uses: actions/checkout@v4
        with:
          ref: stage1a-extended-v3

      - name: Checkout persistent market-data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Parquet writer
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: Run Stage 1a v3 tests
        working-directory: signal_autopilot
        run: python -m unittest tests.test_stage1a_extended tests.test_stage1a_extended_v3 -v

      - name: Calculate rolling 730-day UTC window
        id: window
        run: |
          END_DATE="$(python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).date().isoformat())')"
          START_DATE="$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc).date() - timedelta(days=730)).isoformat())')"
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "730-day UTC window: $START_DATE to $END_DATE (end exclusive)"

      - name: Scan full Binance universe and download 730-day hourly history
        id: history
        working-directory: signal_autopilot
        run: |
          python scripts/run_stage1a_extended_v3.py \
            --start-date "\${{ steps.window.outputs.start_date }}" \
            --end-date "\${{ steps.window.outputs.end_date }}" \
            --output-dir ../market-data/datasets/stage1a_extended_v3/ohlcv_1h \
            --report data/stage1a_extended_v3_report.json

      - name: Upload Stage 1a v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-extended-v3-evidence
          path: signal_autopilot/data/stage1a_extended_v3_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit complete historical datasets
        if: steps.history.outcome == 'success'
        working-directory: market-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/stage1a_extended_v3/ohlcv_1h
          if ! git diff --cached --quiet; then
            git commit -m "Add Stage 1a v3 validated 730-day Binance futures history"
            git push origin HEAD:market-data
          fi

      - name: Verify Stage 1a v3 gate
        if: steps.history.outcome == 'success'
        working-directory: signal_autopilot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/stage1a_extended_v3_report.json").read_text())
          counts = report["universe_counts"]
          print("All active Binance USDT-M perpetuals:", counts["binance_usdtm_perpetuals_total"])
          print("24h quote volume >= $50M:", counts["symbols_volume_50m"])
          print("730d listing age + $50M volume:", counts["symbols_listing_730d"])
          print("Continuous 730d hourly history:", report["symbols_full_history"])
          if report["stage1a_extended_status"] != "PASS":
              raise SystemExit("FAIL: fewer than 40 symbols have complete 730-day hourly history")
          PY
