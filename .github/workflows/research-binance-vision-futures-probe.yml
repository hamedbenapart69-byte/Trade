name: Research - Binance Vision USD-M Futures Archive Probe

on:
  push:
    branches:
      - v21.1/provider-federation-v1
    paths:
      - "research/probe_binance_vision_futures.py"
      - ".github/workflows/research-binance-vision-futures-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe archive availability and SHA-256 checksums
        run: python research/probe_binance_vision_futures.py
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-vision-usdm-futures-probe
          path: artifacts/binance-vision-futures-probe.json
          if-no-files-found: warn
          retention-days: 14
