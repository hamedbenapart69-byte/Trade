name: OKX Public Endpoint Phase 0

on:
  push:
    branches: [stage1b-lrt15m]
    paths:
      - "scripts/test_okx_endpoints.py"
      - ".github/workflows/test_okx_endpoints.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okx-endpoint-phase0
  cancel-in-progress: false

jobs:
  endpoint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: stage1b-lrt15m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 15 public endpoint checks
        run: python scripts/test_okx_endpoints.py

      - name: Upload endpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-endpoints-phase0-${{ github.run_id }}
          path: artifacts/okx_endpoints_test.json
          if-no-files-found: error
          retention-days: 30
