name: Stage 2 Source Probe (CoinGecko, OKX, Bybit)
# Probe execution trigger: QC requested three-source verification.
# Include symbol normalization coverage in the live evidence.
on:
  push:
    branches: [stage2-daily-swing-provider-gate]
    paths:
      - ".github/workflows/stage2-source-probe.yml"
      - "signal_autopilot/scripts/stage2_source_probe.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage2-source-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe all three sources from GitHub Runner
        run: |
          mkdir -p artifacts
          python signal_autopilot/scripts/stage2_source_probe.py | tee artifacts/source-probe-console.json
      - name: Upload source probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-source-probe-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
