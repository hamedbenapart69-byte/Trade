name: Legacy Stage 1B P0 Persistence (Quarantined by V18.2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persist:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "LEGACY_STAGE1B_P0_PERSISTENCE=DISABLED"

  cleanup-artifacts:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "LEGACY_STAGE1B_ARTIFACT_CLEANUP=DISABLED"
