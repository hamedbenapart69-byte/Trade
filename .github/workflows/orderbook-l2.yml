name: Public L2 Order Book Collector

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Capture duration (60-900 seconds)"
        required: false
        default: "600"
      symbols:
        description: "Comma-separated supported symbols"
        required: false
        default: "BTC,ETH,SOL,XRP,DOGE,ADA,LINK,LTC,BCH,AVAX"
  push:
    branches: [main]
    paths:
      - ".github/workflows/orderbook-l2.yml"
      - "signal_autopilot/modules/orderbook_l2.py"
      - "signal_autopilot/scripts/collect_orderbook_l2.py"
      - "signal_autopilot/scripts/merge_orderbook_l2.py"
      - "signal_autopilot/requirements.txt"

permissions:
  contents: read

concurrency:
  group: public-l2-orderbook-collector
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  collect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default-branch collector
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signal_autopilot/requirements.txt

      - name: Install public market-data dependencies
        working-directory: signal_autopilot
        run: pip install -r requirements.txt

      - name: Capture public order books
        working-directory: signal_autopilot
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          DURATION="${{ inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              DURATION=60
            else
              DURATION=600
            fi
          fi
          SYMBOLS="${{ inputs.symbols || 'BTC,ETH,SOL,XRP,DOGE,ADA,LINK,LTC,BCH,AVAX' }}"
          python scripts/collect_orderbook_l2.py --duration-seconds "$DURATION" --sample-interval-seconds 10 --symbols "$SYMBOLS"

      - name: Upload raw capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderbook-l2-capture-${{ github.run_id }}
          path: signal_autopilot/data/orderbook_l2/
          if-no-files-found: warn
          retention-days: 30

  persist:
    needs: collect
    if: ${{ github.ref == 'refs/heads/main' && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted merge utility from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted-tools
          persist-credentials: false

      - name: Checkout market-data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data
          persist-credentials: true

      - name: Download capture artifact from this run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: orderbook-l2-capture-${{ github.run_id }}
          path: incoming

      - name: Merge validated Parquet capture into market-data
        shell: bash
        run: |
          set -euo pipefail
          if ! find incoming -name '*.parquet' -print -quit 2>/dev/null | grep -q .; then
            echo "No valid L2 snapshots; nothing to persist."
            exit 0
          fi
          python -m pip install --disable-pip-version-check pyarrow
          python trusted-tools/signal_autopilot/scripts/merge_orderbook_l2.py \
            --source-dir incoming \
            --target-dir market-data/orderbook_l2
          if [ -f incoming/summary_latest.json ]; then
            cp incoming/summary_latest.json market-data/orderbook_l2/summary_latest.json
          fi

      - name: Persist with synchronized non-force push
        shell: bash
        run: |
          set -euo pipefail
          git -C market-data config user.name "github-actions[bot]"
          git -C market-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C market-data add orderbook_l2
          if git -C market-data diff --cached --quiet; then
            echo "No new Parquet rows."
            exit 0
          fi
          git -C market-data commit -m "data: append public L2 order-book samples"
          for attempt in 1 2 3; do
            git -C market-data fetch origin refs/heads/market-data:refs/remotes/origin/market-data
            if ! git -C market-data rebase refs/remotes/origin/market-data; then
              git -C market-data rebase --abort || true
              echo "Rebase conflict on market-data; refusing a force push"
              exit 1
            fi
            if git -C market-data push origin HEAD:refs/heads/market-data; then
              exit 0
            fi
            echo "market-data advanced during push (attempt $attempt/3); retrying"
            sleep 2
          done
          echo "Could not update market-data after 3 synchronized push attempts"
          exit 1
