name: Public L2 Order Book Collector
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Capture duration (60-900 seconds)"
        required: false
        default: "600"
      symbols:
        description: "Comma-separated supported symbols"
        required: false
        default: "BTC,ETH,SOL,XRP,DOGE,ADA,LINK,LTC,BCH,AVAX"
  push:
    branches: [main, feat/orderbook-l2-l1, fix/orderbook-l2-per-symbol-freshness, stabilization/v9-hardening]
    paths:
      - ".github/workflows/orderbook-l2.yml"
      - "signal_autopilot/modules/orderbook_l2.py"
      - "signal_autopilot/scripts/collect_orderbook_l2.py"
      - "signal_autopilot/scripts/merge_orderbook_l2.py"
      - "signal_autopilot/requirements.txt"
permissions:
  contents: write
concurrency:
  group: public-l2-orderbook-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signal_autopilot/requirements.txt
      - name: Install public market-data dependencies
        working-directory: signal_autopilot
        run: pip install -r requirements.txt
      - name: Capture public order books
        working-directory: signal_autopilot
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          DURATION="${{ inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              DURATION=60
            else
              DURATION=600
            fi
          fi
          SYMBOLS="${{ inputs.symbols || 'BTC,ETH,SOL,XRP,DOGE,ADA,LINK,LTC,BCH,AVAX' }}"
          python scripts/collect_orderbook_l2.py --duration-seconds "$DURATION" --sample-interval-seconds 10 --symbols "$SYMBOLS"
      - name: Upload raw capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderbook-l2-capture-${{ github.run_id }}
          path: signal_autopilot/data/orderbook_l2/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist Parquet to market-data branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! find signal_autopilot/data/orderbook_l2 -name '*.parquet' -print -quit | grep -q .; then
            echo "No valid L2 snapshots; nothing to persist."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/heads/market-data:refs/remotes/origin/market-data
          git worktree add /tmp/market-data refs/remotes/origin/market-data
          python signal_autopilot/scripts/merge_orderbook_l2.py \
            --source-dir signal_autopilot/data/orderbook_l2 \
            --target-dir /tmp/market-data/orderbook_l2
          if [ -f signal_autopilot/data/orderbook_l2/summary_latest.json ]; then
            cp signal_autopilot/data/orderbook_l2/summary_latest.json /tmp/market-data/orderbook_l2/summary_latest.json
          fi
          git -C /tmp/market-data add orderbook_l2
          if ! git -C /tmp/market-data diff --cached --quiet; then
            git -C /tmp/market-data commit -m "data: append public L2 order-book samples"
            # Stage 1b writes to the same branch; synchronize before every push.
            for attempt in 1 2 3; do
              git -C /tmp/market-data fetch origin +refs/heads/market-data:refs/remotes/origin/market-data
              if ! git -C /tmp/market-data rebase refs/remotes/origin/market-data; then
                git -C /tmp/market-data rebase --abort || true
                echo "Rebase conflict on market-data; refusing a force push"
                exit 1
              fi
              if git -C /tmp/market-data push origin HEAD:refs/heads/market-data; then
                exit 0
              fi
              echo "market-data advanced during push (attempt $attempt/3); retrying"
              sleep 2
            done
            echo "Could not update market-data after 3 synchronized push attempts"
            exit 1
          else
            echo "No new Parquet rows."
          fi
