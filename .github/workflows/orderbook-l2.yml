name: Public L2 Order Book Collector

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Capture duration (60-900 seconds)"
        required: false
        default: "600"
      symbols:
        description: "Comma-separated supported symbols"
        required: false
        default: "BTC,ETH,SOL,XRP,DOGE,ADA,LINK,LTC,BCH,AVAX"
  push:
    branches: [main, feat/orderbook-l2-l1, fix/orderbook-l2-per-symbol-freshness, stabilization/v9-hardening]
    paths:
      - ".github/workflows/orderbook-l2.yml"
      - "signal_autopilot/modules/orderbook_l2.py"
      - "signal_autopilot/scripts/collect_orderbook_l2.py"
      - "signal_autopilot/scripts/merge_orderbook_l2.py"
      - "signal_autopilot/requirements.txt"

permissions:
  contents: read

concurrency:
  group: public-l2-orderbook-collector
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signal_autopilot/requirements.txt

      - name: Install public market-data dependencies
        working-directory: signal_autopilot
        run: pip install -r requirements.txt

      - name: Capture public order books
        working-directory: signal_autopilot
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          DURATION="${{ inputs.duration_seconds }}"
          if [ -z "$DURATION" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              DURATION=60
            else
              DURATION=600
            fi
          fi
          SYMBOLS="${{ inputs.symbols || 'BTC,ETH,SOL,XRP,DOGE,ADA,LINK,LTC,BCH,AVAX' }}"
          python scripts/collect_orderbook_l2.py --duration-seconds "$DURATION" --sample-interval-seconds 10 --symbols "$SYMBOLS"

      - name: Upload raw capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orderbook-l2-capture-${{ github.run_id }}
          path: signal_autopilot/data/orderbook_l2/
          if-no-files-found: warn
          retention-days: 30
