name: Additional Public Futures Endpoint Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe OKX, Gate and Hyperliquid public APIs
        run: |
          set -o pipefail
          python scripts/public_market_endpoint_probe_v2.py | tee public-market-endpoint-probe-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-market-endpoint-probe-v2
          path: public-market-endpoint-probe-v2.json
          retention-days: 14
