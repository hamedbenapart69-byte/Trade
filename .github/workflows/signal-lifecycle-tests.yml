name: Signal Lifecycle Unit Tests

on:
  push:
    branches:
      - integration/signal-lifecycle-v1
    paths:
      - "signal_autopilot/modules/signal_lifecycle.py"
      - "signal_autopilot/tests/test_signal_lifecycle.py"
      - ".github/workflows/signal-lifecycle-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run lifecycle tests
        working-directory: signal_autopilot
        run: python -m unittest tests.test_signal_lifecycle -v
