name: V6 Live Market Validation

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: v6-live-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      V5_DATA_PROVIDER: okx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V6 scan against public live market data
        run: python scripts/v5_live_scan.py
      - name: Upload raw V6 scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-live-market-scan
          path: artifacts/v5_live_scan.json
          if-no-files-found: error
          retention-days: 3
