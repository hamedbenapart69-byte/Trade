name: Futures Signals Pipeline
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message (requires TELEGRAM_TOKEN and TELEGRAM_CHAT_ID)"
        required: false
        type: boolean
        default: false
  push:
    branches: [stage-1-data-layer-v1]
    paths:
      - ".github/workflows/signals.yml"
      - "logic.py"
      - "modules/**"
      - "requirements.txt"
permissions:
  contents: write
concurrency:
  group: futures-signals-data-publisher
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout compute branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify public OKX connectivity
        run: |
          python -m pip install --upgrade pip
          pip install "ccxt>=4.4,<5.0"
          python -c 'import ccxt; ex=ccxt.okx(); t=ex.fetch_ticker("BTC/USDT:USDT"); print("OKX PASS: BTCUSDT =", t["last"]); assert t["last"] is not None'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Validate Python and dashboard assets
        run: |
          python -m compileall -q logic.py modules
          python -m unittest discover -s tests -v
          node --check web/app.js
      - name: Fetch data and compute signals
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python logic.py
      - name: Optional Telegram test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram == true }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c 'from modules.notifier import send_test_message; print(send_test_message())'
      - name: Publish data to isolated signals branch
        shell: bash
        run: |
          set -euo pipefail
          cp data/signals.json /tmp/signals.json
          cp data/history.csv /tmp/history.csv
          git fetch origin signals
          git switch --force-create publish-signals origin/signals
          cp /tmp/signals.json ./signals.json
          cp /tmp/history.csv ./history.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json history.csv
          if git diff --cached --quiet; then
            echo "Signals branch already contains this exact data."
          else
            git commit -m "chore(signals): publish latest market scan [skip ci]"
            git push origin HEAD:signals
          fi
