name: Futures Signals Pipeline
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send one Telegram test message (requires TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets)"
        required: false
        type: boolean
        default: false
  push:
    branches: [stage-1-data-layer-v1]
    paths:
      - ".github/workflows/signals.yml"
      - "logic.py"
      - "modules/**"
      - "web/**"
      - "requirements.txt"
      - "!web/data/**"
permissions:
  contents: write
concurrency:
  group: futures-signals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Test OKX from GitHub Actions runner
        run: |
          python -m pip install --upgrade pip
          pip install "ccxt>=4.4,<5.0"
          python -c 'import ccxt; ex = ccxt.okx(); ticker = ex.fetch_ticker("BTC/USDT:USDT"); print("OKX PASS: BTCUSDT =", ticker["last"]); assert ticker["last"] is not None'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Validate Python and dashboard assets
        run: |
          python -m compileall -q logic.py modules
          python -m unittest discover -s tests -v
          node --check web/app.js
      - name: Fetch data, compute signals and publish JSON/CSV
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python logic.py
      - name: Optional Telegram test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c 'from modules.notifier import send_test_message; print(send_test_message())'
      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/signals.json data/history.csv web/data/signals.json web/data/history.csv
          if ! git diff --cached --quiet; then
            git fetch origin "$GITHUB_REF_NAME"
            git reset --mixed "origin/$GITHUB_REF_NAME"
            git add -f data/signals.json data/history.csv web/data/signals.json web/data/history.csv
            if ! git diff --cached --quiet; then
              git commit -m "chore: publish scheduled futures signals [skip ci]"
              git push
            else
              echo "Remote already has equivalent dashboard data."
            fi
          else
            echo "No dashboard data changes to commit."
          fi
