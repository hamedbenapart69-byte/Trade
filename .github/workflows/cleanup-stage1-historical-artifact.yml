name: Cleanup Historical Stage 1 Artifact (One-time)

on:
  push:
    branches: [feat/cpp-stage1-clean]
    paths:
      - "docs/evidence/delete-stage1-artifact-14352156550.txt"

permissions:
  actions: write
  contents: read

jobs:
  delete-historical-artifact:
    if: ${{ contains(github.event.head_commit.message, '[DELETE_STAGE1_ARTIFACT]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the single historical Stage 1 artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://api.github.com/repos/hamedbenapart69-byte/Trade/actions/artifacts/14352156550"
          DELETE_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$URL")
          test "$DELETE_STATUS" = "204" || test "$DELETE_STATUS" = "404"
          GET_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$URL")
          test "$GET_STATUS" = "404"
          echo "HISTORICAL_ARTIFACT_DELETED_AND_404_VERIFIED"
