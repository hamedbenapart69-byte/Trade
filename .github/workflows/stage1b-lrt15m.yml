name: Stage 1b - LRT 15m - 27 symbols

on:
  push:
    branches: [stage1b-lrt15m]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1b-lrt15m-history
  cancel-in-progress: false

jobs:
  stage1b-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Stage 1b code
        uses: actions/checkout@v4
        with:
          ref: stage1b-lrt15m

      - name: Checkout market-data storage
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Parquet runtime
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: Run Stage 1a and Stage 1b unit tests
        working-directory: signal_autopilot
        run: |
          python -m unittest \
            tests.test_stage1a_extended \
            tests.test_stage1a_extended_v3 \
            tests.test_stage1a_extended_v4 \
            tests.test_stage1b_lrt15m -v

      - name: Calculate 730-day UTC history window
        id: window
        run: |
          END_DATE="$(python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).date().isoformat())')"
          START_DATE="$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc).date() - timedelta(days=730)).isoformat())')"
          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Download 15m history for the fixed 27-symbol universe
        id: download15m
        continue-on-error: true
        run: |
          python signal_autopilot/scripts/download_lrt15m_history.py \
            --start-date "${{ steps.window.outputs.start_date }}" \
            --end-date "${{ steps.window.outputs.end_date }}" \
            --output-dir market-data/datasets/stage1b/lrt15m \
            --report signal_autopilot/data/stage1b_15m_data_report.json

      - name: Compute LRT-15m signals
        if: always() && steps.download15m.outcome != 'skipped'
        run: |
          python signal_autopilot/modules/lrt15m_engine.py \
            --data-dir market-data/datasets/stage1b/lrt15m \
            --output market-data/datasets/stage1b/signals/signals.json \
            --universe signal_autopilot/data/stage1b_universe_27.json

      - name: Upload Stage 1b evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1b-lrt15m-evidence
          path: |
            signal_autopilot/data/stage1b_15m_data_report.json
            market-data/datasets/stage1b/signals/signals.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit validated 15m data and signals
        if: steps.download15m.outcome == 'success'
        working-directory: market-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/stage1b/lrt15m datasets/stage1b/signals
          if ! git diff --cached --quiet; then
            git commit -m "Add validated Stage 1b LRT 15m data and signals"
            git push origin HEAD:market-data
          fi

      - name: Verify Stage 1b data gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("signal_autopilot/data/stage1b_15m_data_report.json")
          if not report_path.exists():
              raise SystemExit("Stage 1b data report is missing")
          report = json.loads(report_path.read_text())
          print("Universe:", report.get("universe_count"))
          print("15m complete histories:", report.get("symbols_complete"))
          print("Processed:", report.get("symbols_processed"))
          print("Status:", report.get("status"))
          if report.get("status") != "PASS":
              raise SystemExit("Stage 1b requires complete 730-day 15m history for all 27 symbols")
          PY
