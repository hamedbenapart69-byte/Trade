name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -r signal_autopilot/requirements.txt
      - name: Run root unittest suite (require nonzero collection)
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          count = suite.countTestCases()
          print(f"ROOT_TESTS_COLLECTED={count}")
          if count == 0:
              raise SystemExit("No root unittest tests were collected")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Test futures signal pipeline
        working-directory: signal_autopilot
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          count = suite.countTestCases()
          print(f"SIGNAL_AUTOPILOT_TESTS_COLLECTED={count}")
          if count == 0:
              raise SystemExit("No signal_autopilot unittest tests were collected")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Validate futures dashboard JavaScript
        run: node --check web/futures/app.js
      - name: Validate Compose configuration
        env:
          CONTROL_API_TOKEN: ci-control-token-which-is-long-enough-123456
          WORKER_API_TOKEN: ci-worker-token-which-is-long-enough-123456
        run: docker compose config --quiet
      - name: Build container image
        run: docker build -t trade-control-plane:ci .
      - name: Container health smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name trade-control-plane-ci -p 127.0.0.1:8000:8000 \
            -e CONTROL_API_TOKEN=ci-control-token-which-is-long-enough-123456 \
            -e WORKER_API_TOKEN=ci-worker-token-which-is-long-enough-123456 \
            -e CONTROL_DB_PATH=/var/lib/control/control.db trade-control-plane:ci
          trap 'docker logs trade-control-plane-ci || true; docker rm -f trade-control-plane-ci >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import time, urllib.request
          last = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as r:
                      assert r.status == 200
                      assert b'"status":"ok"' in r.read()
                  print("Container health check passed")
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"Container health check failed: {last}")
          PY

  education-event-study:
    if: startsWith(github.head_ref, 'research/education-') || startsWith(github.ref_name, 'research/education-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Parquet reader
        run: python -m pip install --upgrade pip pyarrow
      - name: Fetch immutable market-data branch snapshot
        shell: bash
        run: |
          git fetch --no-tags origin market-data
          mkdir -p /tmp/market-data
          git archive FETCH_HEAD parquet/okx_swap/ohlcv_1h STAGE1_COMPLETE.json | tar -x -C /tmp/market-data
      - name: Run H1/H6/H7 walk-forward event study
        run: |
          python scripts/education_event_study.py \
            --data-root /tmp/market-data/parquet/okx_swap/ohlcv_1h \
            --manifest /tmp/market-data/STAGE1_COMPLETE.json \
            --output artifacts/education-event-study.json
      - name: Validate research output
        run: |
          python -m json.tool artifacts/education-event-study.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/education-event-study.json").read_text())
          assert result["status"] == "RESEARCH_PRE_SCREEN_ONLY"
          assert result["dataset"]["loaded_symbols"] == result["dataset"]["manifest_successful_symbols"]
          assert result["dataset"]["rows"] > 0
          assert result["walk_forward"]["folds"] > 0
          assert result["cost_model"]["status"] == "PARTIAL_COST_ONLY"
          print("Research artifact schema and dataset coverage validated.")
          PY
      - name: Upload event-study report
        uses: actions/upload-artifact@v4
        with:
          name: education-hypothesis-event-study
          path: artifacts/education-event-study.json
          if-no-files-found: error
          retention-days: 14
