name: Trader_me Stage 1B LRT-15m Signal Bot

on:
  push:
    branches: [production-v1]
    paths:
      - "config/universe.json"
      - "signal_autopilot/main.py"
      - "signal_autopilot/modules/**"
      - "signal_autopilot/telegram_bot.py"
      - ".github/workflows/signal_bot.yml"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trader-me-stage1-signal-bot
  cancel-in-progress: false

jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/signal_autopilot
    steps:
      - name: Checkout the sole production code source
        uses: actions/checkout@v4
        with:
          ref: production-v1
          persist-credentials: false

      - name: Checkout persisted open-signal state (read-only)
        uses: actions/checkout@v4
        with:
          ref: signal-state
          path: persisted-open-state
          persist-credentials: false

      - name: Checkout persisted research state (read-only)
        uses: actions/checkout@v4
        with:
          ref: stage1-research-data
          path: persisted-research-state
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: signal_autopilot/requirements.txt

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r signal_autopilot/requirements.txt

      - name: Validate exact 27-symbol universe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("config/universe.json").read_text(encoding="utf-8"))
          symbols = payload["symbols"]
          assert len(symbols) == 27 and len(set(symbols)) == 27, symbols
          print("UNIVERSE_VALIDATED", len(symbols))
          PY

      - name: Run Stage 1B LFS v2 unit tests
        working-directory: signal_autopilot
        run: |
          python -m unittest \
            tests.test_imports \
            tests.test_lrt_engine \
            tests.test_live_signal_bot \
            tests.test_stage1b_lrt15m \
            tests.test_lrt15m_download \
            tests.test_cvd_proxy_tracker \
            tests.test_lfs_v2 \
            tests.test_stage1_research_mode \
            tests.test_research_tracker \
            tests.test_telegram_channel_guard \
            tests.test_trusted_telegram_notifier -v

      - name: Restore persisted state snapshots
        run: |
          set -euo pipefail
          install -D persisted-open-state/signal_autopilot/state/open_signals.json signal_autopilot/state/open_signals.json
          install -D persisted-research-state/signal_autopilot/state/research_signals.json signal_autopilot/state/research_signals.json

      - name: Run live 27-symbol LFS v2 scan (read-only, no Telegram credentials)
        working-directory: signal_autopilot
        env:
          LOG_LEVEL: INFO
        run: python main.py

      - name: Upload open-signal state for trusted persistence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1b-open-signal-state
          path: signal_autopilot/state/open_signals.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload report and diagnostics for trusted notifier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-me-stage1-signal-bot-${{ github.run_id }}
          path: |
            signal_autopilot/artifacts/charts/
            signal_autopilot/artifacts/diagnostics/gates_diagnostic.json
            signal_autopilot/artifacts/stage1_lrt_report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload research state for trusted persistence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-research-state-${{ github.run_id }}
          path: signal_autopilot/state/research_signals.json
          if-no-files-found: error
          retention-days: 30
