name: Trader_me Stage 1B LRT-15m Signal Bot

on:
  push:
    branches: [stage1b-lrt15m]
    paths:
      - "config/universe.json"
      - "signal_autopilot/**"
      - ".github/workflows/signal_bot.yml"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trader-me-stage1-signal-bot
  cancel-in-progress: true

jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: stage1b-lrt15m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: signal_autopilot/requirements.txt

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r signal_autopilot/requirements.txt

      - name: Validate exact 27-symbol universe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("config/universe.json").read_text(encoding="utf-8"))
          symbols = p["symbols"]
          assert len(symbols) == 27 and len(set(symbols)) == 27, symbols
          print("UNIVERSE_VALIDATED", len(symbols), symbols)
          PY

      - name: Run unit tests
        working-directory: signal_autopilot
        run: |
          python -m unittest tests.test_lrt_engine tests.test_live_signal_bot tests.test_stage1b_lrt15m tests.test_lrt15m_download tests.test_cvd_proxy_tracker -v

      - name: Restore persisted open-signal state
        run: |
          git fetch origin signal-state:refs/remotes/origin/signal-state
          git show origin/signal-state:signal_autopilot/state/open_signals.json > signal_autopilot/state/open_signals.json

      - name: Force-test Telegram delivery (one-time commit trigger)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[force-test]')
        working-directory: signal_autopilot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
        run: python force_test.py

      - name: Diagnose every 27-symbol gate (read-only)
        working-directory: signal_autopilot
        run: python scripts/diagnose_gates.py --universe ../config/universe.json --output artifacts/diagnostics/gates_diagnostic.json

      - name: Run live 27-symbol scan and Telegram delivery
        working-directory: signal_autopilot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
        run: python main.py

      - name: Persist open-signal state to signal-state branch
        if: always()
        run: |
          git fetch origin signal-state
          git worktree add -B signal-state /tmp/signal-state origin/signal-state
          mkdir -p /tmp/signal-state/signal_autopilot/state
          cp signal_autopilot/state/open_signals.json /tmp/signal-state/signal_autopilot/state/open_signals.json
          cd /tmp/signal-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_autopilot/state/open_signals.json
          if git diff --cached --quiet; then
            echo "SIGNAL_STATE_UNCHANGED"
          else
            git commit -m "state: persist open signals [skip ci]"
            git push origin HEAD:signal-state
          fi

      - name: Upload charts and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-me-stage1-signal-bot-${{ github.run_id }}
          path: |
            signal_autopilot/artifacts/charts/
            signal_autopilot/artifacts/diagnostics/gates_diagnostic.json
            signal_autopilot/artifacts/stage1_lrt_report.json
          if-no-files-found: ignore
          retention-days: 7
