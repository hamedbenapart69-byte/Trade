name: Trader_me Stage 1B LRT-15m Scanner (Channel Guarded)

on:
  push:
    branches: [stage1b-lrt15m]
    paths:
      - "config/universe.json"
      - "signal_autopilot/**"
      - ".github/workflows/signal_bot.yml"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trader-me-stage1-signal-bot
  cancel-in-progress: true

jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/signal_autopilot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: stage1b-lrt15m
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: signal_autopilot/requirements.txt

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r signal_autopilot/requirements.txt

      - name: Validate exact 27-symbol universe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("config/universe.json").read_text(encoding="utf-8"))
          symbols = p["symbols"]
          assert len(symbols) == 27 and len(set(symbols)) == 27, symbols
          print("UNIVERSE_VALIDATED", len(symbols), symbols)
          PY

      - name: Run unit tests
        working-directory: signal_autopilot
        run: |
          python -m unittest tests.test_lrt_engine tests.test_live_signal_bot tests.test_stage1b_lrt15m tests.test_lrt15m_download tests.test_cvd_proxy_tracker tests.test_lfs_v2 tests.test_stage1_research_mode tests.test_research_tracker tests.test_telegram_channel_guard -v

      - name: Restore persisted open-signal state
        run: |
          git fetch origin signal-state:refs/remotes/origin/signal-state
          git show origin/signal-state:signal_autopilot/state/open_signals.json > signal_autopilot/state/open_signals.json

      - name: Restore persisted research collection
        run: |
          git fetch origin stage1-research-data:refs/remotes/origin/stage1-research-data
          git show origin/stage1-research-data:signal_autopilot/state/research_signals.json > signal_autopilot/state/research_signals.json

      - name: Run live 27-symbol LFS_v2 scan with optional Telegram delivery
        working-directory: signal_autopilot
        env:
          LOG_LEVEL: INFO
          # Fail-closed: هیچ پیام سیگنالی تا تأیید دستی #TEST و بازکردن قفل ارسال نمی‌شود.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_DELIVERY_UNLOCK == 'CR11_CHANNEL_TEST_PASSED' && secrets.TELEGRAM_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DELIVERY_UNLOCK == 'CR11_CHANNEL_TEST_PASSED' && secrets.TELEGRAM_CHAT_ID || '' }}
          TELEGRAM_EXPECTED_CHANNEL_TITLE: "God signals crypto furthers"
        run: python main.py

      - name: Upload open-signal state for trusted persistence workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1b-open-signal-state
          path: signal_autopilot/state/open_signals.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload charts and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-me-stage1-signal-bot-${{ github.run_id }}
          path: |
            signal_autopilot/artifacts/charts/
            signal_autopilot/artifacts/diagnostics/gates_diagnostic.json
            signal_autopilot/artifacts/stage1_lrt_report.json
            signal_autopilot/state/research_signals.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload research-state snapshot for persistent branch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-research-state-${{ github.run_id }}
          path: signal_autopilot/state/research_signals.json
          if-no-files-found: warn
          retention-days: 30

  persist-research-state:
    needs: live-scan
    if: needs.live-scan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout persistent research branch
        uses: actions/checkout@v4
        with:
          ref: stage1-research-data

      - name: Download research-state snapshot
        uses: actions/download-artifact@v4
        with:
          name: stage1-research-state-${{ github.run_id }}
          path: research-artifact

      - name: Commit unique research observations
        run: |
          mkdir -p signal_autopilot/state
          cp research-artifact/research_signals.json signal_autopilot/state/research_signals.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal_autopilot/state/research_signals.json
          if git diff --cached --quiet; then
            echo "RESEARCH_STATE_UNCHANGED"
          else
            git commit -m "data(research): persist Stage 1 research observations"
            git push origin HEAD:stage1-research-data
          fi
