name: Trader_me Stage 1 Signal Bot

on:
  push:
    branches: [stage1b-lrt15m]
    paths:
      - "config/universe.json"
      - "signal_autopilot/**"
      - ".github/workflows/signal_bot.yml"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trader-me-stage1-signal-bot
  cancel-in-progress: false

jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: stage1b-lrt15m
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: signal_autopilot/requirements.txt

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r signal_autopilot/requirements.txt

      - name: Validate exact 27-symbol universe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("config/universe.json").read_text(encoding="utf-8"))
          symbols = p["symbols"]
          assert len(symbols) == 27 and len(set(symbols)) == 27, symbols
          print("UNIVERSE_VALIDATED", len(symbols), symbols)
          PY

      - name: Run unit tests
        working-directory: signal_autopilot
        run: |
          python -m unittest tests.test_live_signal_bot tests.test_stage1b_lrt15m tests.test_lrt15m_download -v

      - name: Run live 27-symbol scan (no delivery credentials)
        working-directory: signal_autopilot
        env:
          LOG_LEVEL: INFO
        run: python main.py

      - name: Upload charts and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-me-stage1-signal-bot-${{ github.run_id }}
          path: |
            signal_autopilot/artifacts/charts/
            signal_autopilot/artifacts/stage1_lrt_report.json
          if-no-files-found: ignore
          retention-days: 7
