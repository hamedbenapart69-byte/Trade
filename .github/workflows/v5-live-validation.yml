name: V5 Live Data Validation
on:
  push:
    branches:
      - feature/futures-signal-autopilot-v5
  pull_request:
    branches:
      - main
permissions:
  contents: read
  actions: write
jobs:
  live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan live public futures data
        run: python scripts/v5_live_scan.py
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-live-scan
          path: artifacts/v5_live_scan.json
          if-no-files-found: error
          retention-days: 7
