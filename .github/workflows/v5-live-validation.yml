name: V5 Live Validation
on:
  workflow_dispatch:
concurrency:
  group: v5-signal-state
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V5_DATA_PROVIDER: okx
      CONTROL_DB_PATH: ./data/control.db
    steps:
      - uses: actions/checkout@v4
      - name: Restore signal and API-usage database
        uses: actions/cache/restore@v4
        with:
          path: data/control.db
          key: ${{ runner.os }}-v5-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-v5-state-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run read-only live scan
        run: python scripts/v5_live_scan.py
      - name: Checkpoint SQLite database
        if: always()
        run: |
          if [ -f data/control.db ]; then
            python -c 'import sqlite3; db=sqlite3.connect("data/control.db"); db.execute("PRAGMA wal_checkpoint(TRUNCATE)"); db.close()'
          fi
      - name: Save persistent signal and API-usage database
        if: always() && hashFiles('data/control.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/control.db
          key: ${{ runner.os }}-v5-state-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-live-scan
          path: artifacts/v5_live_scan.json
          if-no-files-found: error
          retention-days: 30
