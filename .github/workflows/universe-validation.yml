name: Crypto Universe Validation

on:
  push:
    branches:
      - fix/crypto-usdt-perpetual-universe
    paths:
      - "signal_autopilot/**"
      - ".github/workflows/universe-validation.yml"

permissions:
  contents: read

jobs:
  validate-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signal_autopilot/requirements.txt
      - name: Install dependencies
        working-directory: signal_autopilot
        run: pip install -r requirements.txt
      - name: Compile changed Python modules
        working-directory: signal_autopilot
        run: python -m py_compile modules/data_fetcher.py modules/signal_engine.py scripts/audit_crypto_universe.py tests/test_crypto_universe.py
      - name: Run unit tests
        working-directory: signal_autopilot
        run: python -m unittest discover -s tests -v
      - name: Advisory live public-market universe audit (non-blocking network diagnostic)
        continue-on-error: true
        working-directory: signal_autopilot
        run: python scripts/audit_crypto_universe.py
      - name: Simulate OKX outage and verify fallback chain (blocking reliability test)
        if: always()
        working-directory: signal_autopilot
        env:
          DEBUG_BLOCK_OKX: "1"
        run: python scripts/audit_crypto_universe.py
      - name: Upload universe audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-usdt-perpetual-universe-audit
          path: signal_autopilot/data/universe_audit*.json
          if-no-files-found: warn
          retention-days: 30
