name: Trusted Stage 1B Telegram Notifier

on:
  workflow_run:
    workflows:
      - "Trader_me Stage 1B LRT-15m Signal Bot"
    types: [completed]
    branches: [main, production-v1]

permissions:
  contents: read

concurrency:
  group: trusted-stage1b-telegram-delivery
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.head_branch == 'production-v1' || github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted notifier from production-v1
        uses: actions/checkout@v4
        with:
          ref: production-v1
          persist-credentials: false

      - name: Checkout durable Telegram delivery ledger
        uses: actions/checkout@v4
        with:
          ref: telegram-delivery-state
          path: delivery-state
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: signal_autopilot/requirements.txt

      - name: Install Telegram notifier dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r signal_autopilot/requirements.txt

      - name: Download report artifact from the completed scanner run
        uses: actions/download-artifact@v4
        with:
          name: trader-me-stage1-signal-bot-${{ github.event.workflow_run.id }}
          path: incoming
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run trusted notifier and delivery-ledger unit tests
        run: |
          python -m unittest discover -s signal_autopilot/tests -p 'test_trusted_telegram_notifier.py' -v
          python -m unittest discover -s signal_autopilot/tests -p 'test_telegram_delivery_ledger.py' -v

      - name: Validate report before claiming delivery
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python signal_autopilot/scripts/notify_stage1b_telegram.py --report incoming/stage1_lrt_report.json --universe config/universe.json --validate-only

      - name: Verify Telegram destination before claiming delivery
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXPECTED_CHANNEL_TITLE: ${{ secrets.TELEGRAM_EXPECTED_CHANNEL_TITLE }}
        run: python signal_autopilot/scripts/notify_stage1b_telegram.py --verify-destination-only

      - name: Claim this scanner run before Telegram delivery
        id: claim
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          CLAIM_OUTPUT="$(python signal_autopilot/scripts/telegram_delivery_ledger.py claim \
            --state delivery-state/signal_autopilot/state/telegram_deliveries.json \
            --run-id "$RUN_ID")"
          printf '%s\n' "$CLAIM_OUTPUT"
          if [ "$CLAIM_OUTPUT" != "DELIVERY_CLAIMED=true" ]; then
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C delivery-state config user.name "github-actions[bot]"
          git -C delivery-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C delivery-state add signal_autopilot/state/telegram_deliveries.json
          git -C delivery-state commit -m "delivery: claim Stage 1B run ${{ github.event.workflow_run.id }} [skip ci]"
          git -C delivery-state push origin HEAD:telegram-delivery-state
          echo "claimed=true" >> "$GITHUB_OUTPUT"

      - name: Send validated Stage 1B report to Telegram
        id: telegram
        if: steps.claim.outputs.claimed == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXPECTED_CHANNEL_TITLE: ${{ secrets.TELEGRAM_EXPECTED_CHANNEL_TITLE }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python signal_autopilot/scripts/notify_stage1b_telegram.py --report incoming/stage1_lrt_report.json --universe config/universe.json

      - name: Finalize durable delivery state
        if: always() && steps.claim.outputs.claimed == 'true'
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          TELEGRAM_OUTCOME: ${{ steps.telegram.outcome }}
        run: |
          set -euo pipefail
          python signal_autopilot/scripts/telegram_delivery_ledger.py finalize \
            --state delivery-state/signal_autopilot/state/telegram_deliveries.json \
            --run-id "$RUN_ID" \
            --outcome "$TELEGRAM_OUTCOME"
          git -C delivery-state add signal_autopilot/state/telegram_deliveries.json
          git -C delivery-state commit -m "delivery: finalize Stage 1B run ${{ github.event.workflow_run.id }} [skip ci]"
          git -C delivery-state push origin HEAD:telegram-delivery-state
