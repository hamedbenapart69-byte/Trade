name: FILUSDT Exact Gap Audit V2
on:
  pull_request:
    paths:
      - "signal_autopilot/scripts/inspect_stage1b_gaps.py"
      - "signal_autopilot/tests/test_inspect_stage1b_gaps.py"
      - ".github/workflows/filusdt-gap-audit-v2.yml"
permissions:
  contents: read
jobs:
  gap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable market-data snapshot
        uses: actions/checkout@v4
        with:
          ref: c34b037e3534192fd95e65a10bc67acba9821f8b
          path: market-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader
        run: python -m pip install pyarrow
      - name: Run offline audit tests
        run: |
          python -m unittest discover -s signal_autopilot/tests -p "test_inspect_stage1b_gaps.py" -v
          python -m py_compile signal_autopilot/scripts/inspect_stage1b_gaps.py
      - name: Audit persisted storage versus compute report
        run: |
          python signal_autopilot/scripts/inspect_stage1b_gaps.py \
            --storage-dir market-data/datasets/stage1b/lrt15m \
            --report market-data/datasets/stage1b/data_report.json \
            --symbol FILUSDT \
            --output filusdt-gap-audit.json
      - name: Upload timestamp-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filusdt-gap-audit-v2
          path: filusdt-gap-audit.json
          retention-days: 14
