name: FILUSDT Binance Vision OHLCV Audit
on:
  pull_request:
    paths:
      - "signal_autopilot/scripts/audit_filusdt_binance_vision_klines.py"
      - "signal_autopilot/tests/test_audit_filusdt_binance_vision_klines.py"
      - "signal_autopilot/scripts/inspect_stage1b_gaps.py"
      - "signal_autopilot/modules/cryptohftdata_provider.py"
      - ".github/workflows/filusdt-binance-vision-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable market-data snapshot
        uses: actions/checkout@v4
        with:
          ref: c34b037e3534192fd95e65a10bc67acba9821f8b
          path: market-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: |
          python -m unittest discover -s signal_autopilot/tests -p "test_audit_filusdt_binance_vision_klines.py" -v
          python -m py_compile signal_autopilot/scripts/audit_filusdt_binance_vision_klines.py
      - name: Verify checksummed official public kline archive coverage
        run: |
          python signal_autopilot/scripts/audit_filusdt_binance_vision_klines.py \
            --storage-dir market-data/datasets/stage1b/lrt15m \
            --report market-data/datasets/stage1b/data_report.json \
            --output filusdt-binance-vision-audit.json
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filusdt-binance-vision-audit
          path: filusdt-binance-vision-audit.json
          retention-days: 14
