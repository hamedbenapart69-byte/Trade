name: OKX Live Smoke Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify live OKX BTC data and contract-aware risk sizing
        run: |
        set -o pipefail
        python scripts/okx_live_smoke.py | tee okx-live-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: okx-live-smoke
          path: okx-live-smoke.json
          retention-days: 14
