name: Alpha Discovery Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/alpha-discovery.yml"
      - "data/pit/**"
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: read
  actions: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pandas numpy scipy lightgbm scikit-learn pyarrow
      - name: Validate PIT membership filter unit tests
        run: python -m unittest research.test_alpha_discovery

      - name: Download latest VTM result artifact and verified PIT universe artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out/vtm_backtest_final data/pit
          LOCK="docs/evidence/alpha-discovery-source-lock-2026-11-24.json"
          RUN_ID="$(jq -r '.dataset.vtm_workflow_run_id' "$LOCK")"
          FINAL_ID="$(jq -r '.dataset.vtm_artifact_id' "$LOCK")"
          PIT_RUN_ID="$(jq -r '.dataset.pit_workflow_run_id' "$LOCK")"
          PIT_UNIVERSE_ARTIFACT_ID="$(jq -r '.dataset.pit_artifact_id' "$LOCK")"
          test "$RUN_ID" != "null" && test "$FINAL_ID" != "null"
          test "$PIT_RUN_ID" != "null" && test "$PIT_UNIVERSE_ARTIFACT_ID" != "null"
          VTM_META="$(gh api "repos/${REPOSITORY}/actions/artifacts/${FINAL_ID}")"
          PIT_META="$(gh api "repos/${REPOSITORY}/actions/artifacts/${PIT_UNIVERSE_ARTIFACT_ID}")"
          test "$(echo "$VTM_META" | jq -r '.name')" = "vtm-backtest-2023-final"
          test "$(echo "$VTM_META" | jq -r '.expired')" = "false"
          test "$(echo "$PIT_META" | jq -r '.name')" = "vtm-pit-2023-universe"
          test "$(echo "$PIT_META" | jq -r '.expired')" = "false"
          test "$(echo "$VTM_META" | jq -r '.workflow_run.id')" = "$RUN_ID"
          test "$(echo "$PIT_META" | jq -r '.workflow_run.id')" = "$PIT_RUN_ID"
          gh api "repos/${REPOSITORY}/actions/artifacts/${FINAL_ID}/zip" > /tmp/vtm-final.zip
          unzip -q /tmp/vtm-final.zip -d out/vtm_backtest_final
          gh api "repos/${REPOSITORY}/actions/artifacts/${PIT_UNIVERSE_ARTIFACT_ID}/zip" > /tmp/vtm-pit-universe.zip
          unzip -q /tmp/vtm-pit-universe.zip -d data/pit
          test -s data/pit/universe_manifest.json
          echo "VTM_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "VTM_FINAL_ARTIFACT_ID=${FINAL_ID}" >> "$GITHUB_ENV"
          echo "PIT_RUN_ID=${PIT_RUN_ID}" >> "$GITHUB_ENV"
          echo "PIT_UNIVERSE_ARTIFACT_ID=${PIT_UNIVERSE_ARTIFACT_ID}" >> "$GITHUB_ENV"
      - name: Cache checksum-verified PIT OHLCV
        uses: actions/cache@v6
        with:
          path: data/pit/ohlcv_2023.parquet
          key: vtm-pit-ohlcv-2023-${{ hashFiles('data/pit/universe_manifest.json') }}
      - name: Reconstruct PIT OHLCV from checksum-pinned Binance Vision archives
        run: |
          if [ -s data/pit/ohlcv_2023.parquet ]; then
            echo "Using checksum-verified OHLCV cache"
          else
            python research/prepare_vtm_pit.py --manifest data/pit/universe_manifest.json --output data/pit/ohlcv_2023.parquet --workers 12
          fi
      - name: Execute LightGBM walk-forward alpha discovery
        id: research
        continue-on-error: true
        run: python research/alpha_discovery.py --data data/pit --output out/report.json
      - name: Attach source artifact provenance
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p="out/report.json"
          if os.path.exists(p):
              x=json.load(open(p))
          else:
              x={"status":"UNAVAILABLE","reason":"Research process did not create report"}
          x["artifact_provenance"]={
              "vtm_result_branch":"stage-vtm-backtest-2023",
              "vtm_workflow_run_id":os.getenv("VTM_RUN_ID"),
              "vtm_final_artifact_id":os.getenv("VTM_FINAL_ARTIFACT_ID"),
              "pit_universe_branch":"stage-vtm-pit-2023",
              "pit_workflow_run_id":os.getenv("PIT_RUN_ID"),
              "pit_universe_artifact_id":os.getenv("PIT_UNIVERSE_ARTIFACT_ID")
          }
          open(p,"w").write(json.dumps(x,indent=2,allow_nan=False)+"\n")
          PY
      - name: Upload raw report and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-discovery-report
          path: |
            out/report.json
            out/vtm_backtest_final/**
            data/pit/universe_manifest.json
            data/pit/universe_membership.csv
            data/pit/universe_daily.csv
            data/pit/ohlcv_2023.parquet
            data/pit/ohlcv_2023.parquet.manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail if discovery did not execute
        if: steps.research.outcome != 'success'
        run: exit 1
