name: Stage 1B Dashboard Publisher (Quarantined by V18.2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-dashboard:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy dashboard publication is disabled
        run: echo "STAGE1B_DASHBOARD=DISABLED_BY_V18_2"

  publish-degraded-report:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy degraded dashboard publication is disabled
        run: echo "STAGE1B_DEGRADED_DASHBOARD=DISABLED_BY_V18_2"
