name: V21.1 Market-Wide Provider Federation Live Gate

on:
  push:
    branches:
      - v21.1/provider-federation-v1
    paths:
      - "cpp/include/cfss/provider_federation.hpp"
      - "cpp/apps/provider_federation_probe/**"
      - "config/provider-policy.v1.json"
      - ".github/workflows/cpp-provider-federation-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-federation-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev nlohmann-json3-dev
      - name: Configure and build provider probe
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target provider_federation_probe --parallel 2
      - name: Probe authenticated and public market-wide providers
        continue-on-error: true
        env:
          COINRANKING_API_KEY: ${{ secrets.COINRANKING_API_KEY }}
          CMC_PRO_API_KEY: ${{ secrets.CMC_PRO_API_KEY }}
        run: |
          mkdir -p artifacts
          ./build/provider_federation_probe artifacts/provider-federation-discovery.v1.json
      - name: Upload provider evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-provider-federation-live-evidence
          path: artifacts/provider-federation-discovery.v1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Require two fresh license-eligible providers across all nine assets
        run: |
          set -euo pipefail
          test -s artifacts/provider-federation-discovery.v1.json
          jq -e '
            .schema_version == "1.0.0" and
            .status == "TWO_FRESH_LICENSE_ELIGIBLE_PROVIDERS_FULL_NINE_ASSET_MATCH" and
            .production_eligible_fresh_provider_count >= 2 and
            .matched_asset_count == 9 and .required_asset_count == 9 and
            ([.candidate_seed[] |
              select(.classification == "TWO_SOURCE_IDENTITY_MATCHED" and
                (.matched_provider_pair == "coinmarketcap+coinranking" or
                 .matched_provider_pair == "coinmarketcap+coinpaprika" or
                 .matched_provider_pair == "coinranking+coinpaprika"))] | length) == 9
          ' artifacts/provider-federation-discovery.v1.json >/dev/null
          echo "V21_1_TWO_LICENSE_ELIGIBLE_PROVIDERS_FULL_NINE_ASSET_PASS"
