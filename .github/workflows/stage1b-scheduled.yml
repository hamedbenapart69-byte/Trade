name: Stage 1b - LRT 15m - 27 symbols

on:
  push:
    branches: [stage1b-lrt15m]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1b-lrt15m-history
  cancel-in-progress: true

jobs:
  stage1b-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Stage 1b code
        uses: actions/checkout@v4
        with:
          ref: stage1b-lrt15m

      - name: Checkout market-data storage
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data

      - name: Checkout signals publication branch
        uses: actions/checkout@v4
        with:
          ref: signals
          path: signals-publish

      - name: Checkout Stage 1b maintenance tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: stage1b-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Parquet runtime
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: Run Stage 1a and Stage 1b unit tests
        working-directory: signal_autopilot
        run: |
          python -m unittest \
            tests.test_stage1a_extended \
            tests.test_stage1a_extended_v3 \
            tests.test_stage1a_extended_v4 \
            tests.test_stage1b_lrt15m \
            tests.test_lrt15m_download -v

      - name: Maintain rolling 730-day data and compute guarded LRT-15m report
        id: maintain15m
        run: |
          python stage1b-tools/signal_autopilot/scripts/maintain_lrt15m_dataset.py \
            --storage-dir market-data/datasets/stage1b/lrt15m \
            --compute-dir signal_autopilot/data/stage1b_compute \
            --report signal_autopilot/data/stage1b_15m_data_report.json \
            --output market-data/datasets/stage1b/signals/signals.json \
            --universe signal_autopilot/data/stage1b_universe_27.json \
            --max-age-minutes 30

      - name: Upload Stage 1b evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1b-lrt15m-evidence
          path: |
            signal_autopilot/data/stage1b_15m_data_report.json
            market-data/datasets/stage1b/signals/signals.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit incremental 15m data and signals
        if: steps.maintain15m.outcome == 'success'
        working-directory: market-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datasets/stage1b/lrt15m datasets/stage1b/signals
          if ! git diff --cached --quiet; then
            git commit -m "Update incremental Stage 1b LRT 15m data and signals"
            # The order-book collector writes to the same branch. Rebase before
            # every push so concurrent public-data jobs cannot lose each other's
            # commits or leave the Stage 1b run red after successful computation.
            for attempt in 1 2 3; do
              git fetch origin market-data
              if ! git rebase FETCH_HEAD; then
                git rebase --abort || true
                echo "Rebase conflict on market-data; refusing a force push"
                exit 1
              fi
              if git push origin HEAD:market-data; then
                exit 0
              fi
              echo "market-data advanced during push (attempt $attempt/3); retrying"
              sleep 2
            done
            echo "Could not update market-data after 3 synchronized push attempts"
            exit 1
          fi

      - name: Verify Stage 1b data gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("signal_autopilot/data/stage1b_15m_data_report.json")
          if not report_path.exists():
              raise SystemExit("Stage 1b data report is missing")
          report = json.loads(report_path.read_text())
          print("Universe:", report.get("universe_count"))
          print("730-day continuous histories:", report.get("symbols_complete"))
          print("Fresh 15m feeds:", report.get("symbols_fresh"))
          print("Status:", report.get("status"))
          if report.get("status") not in {"PASS", "DEGRADED"}:
              raise SystemExit("Stage 1b report has an invalid data-gate state")
          PY

      - name: Publish LRT-15m report to signals branch
        if: success() && steps.maintain15m.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("signal_autopilot/data/stage1b_15m_data_report.json").read_text())
          if report.get("status") not in {"PASS", "DEGRADED"}:
              raise SystemExit("Refusing to publish: Stage 1b report state is invalid")
          source = Path("market-data/datasets/stage1b/signals/signals.json")
          if not source.exists():
              raise SystemExit("LRT-15m signals output is missing")
          payload = json.loads(source.read_text())
          payload["data_gate_status"] = report["status"]
          payload["data_coverage"] = {
              "universe_count": report.get("universe_count"),
              "symbols_complete": report.get("symbols_complete"),
              "symbols_processed": report.get("symbols_processed"),
              "symbols_fresh": report.get("symbols_fresh"),
              "start_date_utc": report.get("start_date_utc"),
              "end_date_exclusive_utc": report.get("end_date_exclusive_utc"),
              "interval": report.get("interval"),
              "max_age_minutes": 30,
          }
          payload["data_freshness"] = [
              {
                  key: item.get(key)
                  for key in ("symbol", "fresh", "age_minutes", "last_open_ms",
                              "continuity", "reason", "new_rows", "provider_status")
              }
              for item in report.get("symbols", [])
          ]
          target = Path("signals-publish/lrt15m_signals.json")
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")
          PY
          git -C signals-publish config user.name "github-actions[bot]"
          git -C signals-publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C signals-publish add lrt15m_signals.json
          if ! git -C signals-publish diff --cached --quiet; then
            git -C signals-publish commit -m "data: publish LRT-15m report"
            for attempt in 1 2 3; do
              git -C signals-publish fetch origin signals
              git -C signals-publish rebase origin/signals
              if git -C signals-publish push origin HEAD:signals; then
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish after 3 synchronized push attempts"
            exit 1
          fi
