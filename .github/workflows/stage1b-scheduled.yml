name: Stage 1b - LRT 15m data maintenance (P0 data-only)

on:
  # Trigger موقت P0؛ فقط روی همین شاخه اجرا می‌شود و پس از Run برگردانده خواهد شد.
  push:
    branches: [p0-stage1b-run-20261110]

permissions:
  contents: write

concurrency:
  group: stage1b-lrt15m-history
  cancel-in-progress: false

jobs:
  stage1b-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Stage 1b data adapters
        uses: actions/checkout@v4
        with:
          ref: stage1b-lrt15m

      - name: Checkout market-data storage
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data

      - name: Checkout P0 maintenance tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: stage1b-tools

      - name: Capture immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "STAGE1B_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MARKET_DATA_SOURCE_SHA=$(git -C market-data rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Parquet runtime
        run: python -m pip install --disable-pip-version-check pyarrow

      - name: Run Stage 1b data-adapter unit tests
        working-directory: signal_autopilot
        run: |
          python -m unittest \
            tests.test_stage1a_extended \
            tests.test_stage1a_extended_v3 \
            tests.test_stage1a_extended_v4 \
            tests.test_stage1b_lrt15m \
            tests.test_lrt15m_download -v

      - name: Run P0 maintenance and manifest unit tests
        working-directory: stage1b-tools/signal_autopilot
        run: python -m unittest tests.test_lrt15m_dataset_maintenance -v

      - name: Maintain rolling 730-day dataset (DATA ONLY)
        id: maintain15m
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python stage1b-tools/signal_autopilot/scripts/maintain_lrt15m_dataset.py \
            --storage-dir market-data/datasets/stage1b/lrt15m \
            --compute-dir signal_autopilot/data/stage1b_compute \
            --report signal_autopilot/data/stage1b_15m_data_report.json \
            --output market-data/datasets/stage1b/signals/signals.json \
            --universe signal_autopilot/data/stage1b_universe_27.json \
            --max-age-minutes 30 \
            --data-only \
            --manifest market-data/datasets/stage1b/manifest.json \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --engine-commit "$STAGE1B_CODE_SHA" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --legacy-source-commit "$MARKET_DATA_SOURCE_SHA"

      - name: Verify SHA-256 manifest and P0 data-only boundary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          report_path = Path("signal_autopilot/data/stage1b_15m_data_report.json")
          manifest_path = Path("market-data/datasets/stage1b/manifest.json")
          if not report_path.exists():
              raise SystemExit("P0_FAIL: Stage 1b data report is missing")
          if not manifest_path.exists():
              raise SystemExit("P0_FAIL: SHA-256 manifest is missing")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          print("DATA_GATE_STATUS:", report.get("status"))
          print("SYMBOLS_COMPLETE:", report.get("symbols_complete"))
          print("SYMBOLS_FRESH:", report.get("symbols_fresh"))
          print("MANIFEST_SHA256:", manifest.get("dataset_sha256"))
          print("MANIFEST_SYMBOLS:", manifest.get("symbols_count"))
          print("MANIFEST_FILES:", manifest.get("files_count"))
          print("SIGNAL_ENGINE_EXECUTED:", manifest.get("signal_engine_executed"))

          if manifest.get("symbols_count") != 27:
              raise SystemExit("P0_FAIL: manifest must contain 27 symbols")
          if manifest.get("baseline_files_count") != 27:
              raise SystemExit("P0_FAIL: manifest must contain 27 canonical baselines")
          if not re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("dataset_sha256", ""))):
              raise SystemExit("P0_FAIL: invalid aggregate SHA-256")
          if manifest.get("signal_engine_executed") is not False:
              raise SystemExit("P0_FAIL: signal engine must remain unexecuted in P0")
          if report.get("status") not in {"PASS", "DEGRADED"}:
              raise SystemExit("P0_FAIL: invalid data-gate state")
          print("P0_DATA_ONLY_MANIFEST=PASS")
          PY

      - name: Upload P0 data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1b-p0-data-evidence
          path: |
            signal_autopilot/data/stage1b_15m_data_report.json
            market-data/datasets/stage1b/manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit normalized 15m data and manifest
        if: steps.maintain15m.outcome == 'success'
        working-directory: market-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datasets/stage1b/lrt15m datasets/stage1b/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "P0: normalize Stage 1b 15m data and publish SHA-256 manifest"
            for attempt in 1 2 3; do
              git fetch origin market-data
              if ! git rebase FETCH_HEAD; then
                git rebase --abort || true
                echo "Rebase conflict on market-data; refusing a force push"
                exit 1
              fi
              if git push origin HEAD:market-data; then
                exit 0
              fi
              echo "market-data advanced during push (attempt $attempt/3); retrying"
              sleep 2
            done
            echo "Could not update market-data after 3 synchronized push attempts"
            exit 1
          fi
