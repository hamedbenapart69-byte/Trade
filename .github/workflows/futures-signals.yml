name: Legacy 1h Futures Signals (QUARANTINED)

on:
  # Retained for auditability only. The historical 1h engine is not runnable
  # from GitHub Actions and cannot publish dashboard or Telegram signals.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy engine is quarantined
        run: |
          echo "LEGACY_1H_ENGINE=QUARANTINED"
          echo "MARKET_SCAN=DISABLED"
          echo "DASHBOARD_PUBLICATION=DISABLED"
          echo "TELEGRAM_DELIVERY=DISABLED"
          echo "No exchange account access or order execution."
