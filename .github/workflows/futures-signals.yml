name: Futures Signals Pipeline
on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send one Telegram connectivity test"
        type: boolean
        required: false
        default: false
      collect_history:
        description: "Run the full two-year Parquet collection"
        type: boolean
        required: false
        default: false
  push:
    branches: [stage1-webfirst-v2-clean, main]
    paths:
      - ".github/workflows/futures-signals.yml"
      - "signal_autopilot/**"
      - "web/futures/**"
      - "!signal_autopilot/data/**"
      - "!web/futures/data/**"
permissions:
  contents: write
concurrency:
  group: futures-signals-single
  cancel-in-progress: false
jobs:
  telegram-test:
    if: github.event_name == 'workflow_dispatch' && inputs.test_telegram == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signal_autopilot/requirements.txt
      - name: Install Telegram dependencies
        working-directory: signal_autopilot
        run: pip install -r requirements.txt
      - name: Send Telegram test message
        working-directory: signal_autopilot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c 'from modules.notifier import send_test_message; result=send_test_message(); print(result); raise SystemExit(0 if result.get("status") == "TEST_SENT" else 1)'

  signals:
    if: github.event_name != 'workflow_dispatch' || inputs.test_telegram != true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signal_autopilot/requirements.txt
      - name: Install signal pipeline dependencies
        working-directory: signal_autopilot
        run: pip install -r requirements.txt
      - name: Restore Telegram delivery ledger from durable signals branch
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/heads/signals >/dev/null 2>&1; then
            git fetch origin +refs/heads/signals:refs/remotes/origin/signals
            if git cat-file -e refs/remotes/origin/signals:telegram_sent.json 2>/dev/null; then
              mkdir -p signal_autopilot/data
              git show refs/remotes/origin/signals:telegram_sent.json > signal_autopilot/data/telegram_sent.json
              echo "TELEGRAM_LEDGER_SOURCE=signals_branch"
            else
              echo "No durable Telegram ledger exists yet on signals branch."
            fi
          else
            echo "Signals branch not present; cache remains the fallback."
          fi
      - name: Restore Telegram deduplication state
        uses: actions/cache/restore@v4
        with:
          path: signal_autopilot/data/telegram_sent.json
          key: ${{ runner.os }}-telegram-sent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-telegram-sent-
      - name: Advisory OKX reachability probe (non-blocking; provider fallback is independent)
        continue-on-error: true
        working-directory: signal_autopilot
        run: |
          python - <<'PY'
          import ccxt
          ex=ccxt.okx()
          try:
              ticker=ex.fetch_ticker("BTC/USDT:USDT")
              print("OKX PASS: BTCUSDT =",ticker["last"])
          except Exception as exc:
              print("OKX FAIL:",type(exc).__name__,str(exc)[:240])
              raise
          finally:
              ex.close()
          PY
      - name: Run signal engine and delivery tests
        working-directory: signal_autopilot
        run: python -m unittest discover -s tests -v
      - name: Fetch data, compute signals and publish dashboard payload
        working-directory: signal_autopilot
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SIGNAL_SYMBOL_LIMIT: "100"
        run: python logic.py
      - name: Save Telegram deduplication state
        if: success() && hashFiles('signal_autopilot/data/telegram_sent.json') != ''
        uses: actions/cache/save@v4
        with:
          path: signal_autopilot/data/telegram_sent.json
          key: ${{ runner.os }}-telegram-sent-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate JSON, CSV and C10
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("signal_autopilot/data/signals.json").read_text(encoding="utf-8"))
          allowed={"BUY_NOW","SELL_NOW","CONDITIONAL_BUY","CONDITIONAL_SELL","WATCHLIST","NO_QUALIFIED_SETUP","MARKET_DATA_DEGRADED"}
          assert p.get("signals") and all(s.get("status") in allowed for s in p["signals"])
          quality = p.get("quality") or {}
          requested = int(quality.get("symbols_requested", quality.get("symbols_processed", 0)))
          processed = int(quality.get("symbols_processed", 0))
          assert processed <= requested
          if p.get("pipeline_status") == "OK":
              assert processed == requested, "partial universe must be labeled DEGRADED"
          assert Path("signal_autopilot/data/history.csv").exists()
          assert Path("web/futures/data/signals.json").exists()
          assert Path("web/futures/data/history.csv").exists()
          print("END-TO-END PAYLOAD PASS:",len(p["signals"]))
          PY
      - name: Validate static dashboard JavaScript
        run: node --check web/futures/app.js
      - name: Publish data to isolated signals branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/heads/signals:refs/remotes/origin/signals
          git worktree add /tmp/signals-public refs/remotes/origin/signals
          python signal_autopilot/scripts/publish_signals_branch.py \
            --source-json signal_autopilot/data/signals.json \
            --source-csv signal_autopilot/data/history.csv \
            --output-dir /tmp/signals-public
          if [ -f signal_autopilot/data/telegram_sent.json ]; then
            cp signal_autopilot/data/telegram_sent.json /tmp/signals-public/telegram_sent.json
            git -C /tmp/signals-public add telegram_sent.json
          fi
          git -C /tmp/signals-public add signals.json history.csv
          if ! git -C /tmp/signals-public diff --cached --quiet; then
            git -C /tmp/signals-public commit -m "data: publish futures signals snapshot"
            for attempt in 1 2 3; do
              git -C /tmp/signals-public fetch origin +refs/heads/signals:refs/remotes/origin/signals
              if ! git -C /tmp/signals-public rebase refs/remotes/origin/signals; then
                git -C /tmp/signals-public rebase --abort || true
                echo "Signals branch rebase conflict (attempt $attempt)."
                sleep $((attempt * 2))
                continue
              fi
              if git -C /tmp/signals-public push origin HEAD:refs/heads/signals; then
                echo "Signals branch updated."
                exit 0
              fi
              echo "Signals branch push retry $attempt/3."
              sleep $((attempt * 2))
            done
            echo "Signals branch push failed after 3 attempts."
            exit 1
          else
            echo "No public data changes."
          fi
      - name: Determine whether two-year history is still required
        id: history_gate
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect_history == true) }}
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/heads/market-data >/dev/null 2>&1; then
            git fetch origin refs/heads/market-data:refs/remotes/origin/market-data
            if git cat-file -e refs/remotes/origin/market-data:STAGE1_COMPLETE.json 2>/dev/null; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Two-year Parquet archive already exists; no duplicate backfill."
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run full two-year Stage 1 collection
        id: stage1_collection
        if: ${{ steps.history_gate.outputs.run == 'true' }}
        continue-on-error: true
        working-directory: signal_autopilot
        run: python scripts/run_stage1_data.py --provider okx --symbols 100 --years 2
      - name: Persist two-year Parquet archive to isolated market-data branch
        if: ${{ steps.stage1_collection.outcome == 'success' }}
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/market-data >/dev/null 2>&1; then
            git fetch origin refs/heads/market-data:refs/remotes/origin/market-data
            git worktree add /tmp/market-data refs/remotes/origin/market-data
          else
            git worktree add -b market-data /tmp/market-data HEAD
          fi
          mkdir -p /tmp/market-data/parquet
          cp -a signal_autopilot/data/stage1/. /tmp/market-data/parquet/
          cp signal_autopilot/data/stage1/stage1_report.json /tmp/market-data/STAGE1_COMPLETE.json
          git -C /tmp/market-data add -A
          if ! git -C /tmp/market-data diff --cached --quiet; then
            git -C /tmp/market-data commit -m "data: archive two-year Stage 1 market history"
            git -C /tmp/market-data push origin HEAD:refs/heads/market-data
          fi
      - name: Fail the run if the requested history collection failed
        if: ${{ steps.stage1_collection.outcome == 'failure' }}
        run: |
          echo "Stage 1 full history collection failed; see collector evidence artifact."
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-signal-evidence
          path: |
            signal_autopilot/data/signals.json
            signal_autopilot/data/history.csv
            signal_autopilot/data/stage1/
          if-no-files-found: warn
          retention-days: 30
