name: PIT Universe Dataset Builder

on:
  push:
    branches: [infrastructure-cleanup]
    paths:
      - "scripts/build_pit_universe.py"
      - "tests/test_pit_universe.py"
      - ".github/workflows/pit-universe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pit-universe-datasets
  cancel-in-progress: false

jobs:
  build-pit-universe:
    name: Build PIT \${{ matrix.year }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - year: "2024"
            start_date: "2024-01-01"
            end_date: "2024-12-31"
          - year: "2025"
            start_date: "2025-01-01"
            end_date: "2025-12-31"
          - year: "2026-01_to_10"
            start_date: "2026-01-01"
            end_date: "2026-10-31"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source and run PIT unit tests
        run: |
          python -m py_compile scripts/build_pit_universe.py tests/test_pit_universe.py
          python -m unittest discover -s tests -p "test_pit_universe.py" -v
      - name: Build verified PIT dataset
        run: |
          python scripts/build_pit_universe.py \
            --start-date "\${{ matrix.start_date }}" \
            --end-date "\${{ matrix.end_date }}" \
            --output-dir "results/pit_universe/\${{ matrix.year }}" \
            --workers 8
      - name: Validate output completeness and manifest
        env:
          START_DATE: \${{ matrix.start_date }}
          END_DATE: \${{ matrix.end_date }}
          OUTPUT_DIR: results/pit_universe/\${{ matrix.year }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          root = Path(os.environ["OUTPUT_DIR"])
          start, end = date.fromisoformat(os.environ["START_DATE"]), date.fromisoformat(os.environ["END_DATE"])
          expected_days = (end - start).days + 1
          manifest = json.loads((root / "universe_manifest.json").read_text())
          daily = json.loads((root / "universe_daily.json").read_text())
          monthly = json.loads((root / "monthly_universe_counts.json").read_text())
          assert manifest["status"] == "PASS"
          assert manifest["universe_period"] == [start.isoformat(), end.isoformat()]
          assert len(daily) == expected_days
          assert manifest["records"]["daily_dates"] == expected_days
          assert len(monthly) == len({row["month"] for row in daily})
          assert all(row["symbols"] == sorted(set(row["symbols"])) for row in daily)
          assert all(row["days_observed"] > 0 for row in monthly)
          print(json.dumps({
              "period": manifest["universe_period"],
              "candidate_symbols": manifest["candidate_symbols_discovered"],
              "symbols_with_rows": manifest["symbols_with_relevant_rows"],
              "verified_archives": manifest["verified_archive_files"],
              "membership_rows": manifest["records"]["membership_rows"],
              "daily_dates": len(daily),
              "monthly_summaries": len(monthly),
              "limitations": manifest["limitations"],
          }, indent=2))
          PY
      - name: Upload PIT dataset and evidence
        uses: actions/upload-artifact@v4
        with:
          name: pit-universe-\${{ matrix.year }}
          path: results/pit_universe/\${{ matrix.year }}/
          if-no-files-found: error
          retention-days: 90
