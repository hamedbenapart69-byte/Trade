name: V9 Temporary Telegram Probe
on:
  push:
    branches:
      - stabilization/v9-hardening
    paths:
      - ".github/workflows/telegram_probe_v9.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check both Telegram destinations and send one test to each
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_AUDIENCE_CHANNEL_ID: ${{ secrets.TELEGRAM_AUDIENCE_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          token = (os.getenv("TELEGRAM_TOKEN") or "").strip()
          current = (os.getenv("TELEGRAM_CHAT_ID") or "").strip()
          audience = (os.getenv("TELEGRAM_AUDIENCE_CHANNEL_ID") or "").strip()

          missing = []
          if not token:
              missing.append("TELEGRAM_TOKEN")
          if not current:
              missing.append("TELEGRAM_CHAT_ID")
          if not audience:
              missing.append("TELEGRAM_AUDIENCE_CHANNEL_ID")

          if missing:
              print("BLOCKED_SECRET_MISSING=" + ",".join(missing))
              raise SystemExit(2)

          base = "https://api.telegram.org/bot" + token + "/"

          def call(method, payload=None):
              data = json.dumps(payload or {}).encode()
              req = urllib.request.Request(
                  base + method, data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.loads(response.read().decode())
              if not result.get("ok"):
                  raise RuntimeError(str(result.get("description", "Telegram API error"))[:240])
              return result["result"]

          me = call("getMe")
          print("BOT_USERNAME=@" + str(me.get("username", "unknown")))
          stamp = datetime.now(timezone.utc).isoformat()
          results = {}
          for label, chat_id in (("CURRENT", current), ("AUDIENCE", audience)):
              try:
                  msg = call("sendMessage", {
                      "chat_id": chat_id,
                      "text": "V9 TELEGRAM PROBE " + label + " " + stamp,
                      "disable_web_page_preview": True,
                  })
                  results[label] = msg.get("message_id")
                  print(label + "_MESSAGE_ID=" + str(results[label]))
              except Exception as exc:
                  print(label + "_ERROR=" + type(exc).__name__ + ":" + str(exc)[:240])
                  raise SystemExit(1)
          print("PROBE_RESULT=PASS_BOTH_DESTINATIONS")
          PY
