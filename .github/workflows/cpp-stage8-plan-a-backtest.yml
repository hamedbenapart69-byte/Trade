name: C++ Stage 8 Plan A Backtest Contract
on:
  pull_request:
    branches: [main]
    paths: ["cpp/**", "contracts/plan-a-backtest-input.v1.schema.json", ".github/workflows/cpp-stage8-plan-a-backtest.yml"]
  push:
    branches: [feat/stage8-gap-fill-audit-v1]
    paths: ["cpp/**", "contracts/plan-a-backtest-input.v1.schema.json", ".github/workflows/cpp-stage8-plan-a-backtest.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage8-plan-a-backtest
  cancel-in-progress: true
jobs:
  stage8-plan-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libcurl4-openssl-dev libssl-dev nlohmann-json3-dev
          npm install --no-save --package-lock=false ajv-cli@5.0.0 ajv-formats@3.0.1
      - name: Full C++ build and CTest
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error
      - name: Compile input schema
        run: npx ajv compile -s contracts/plan-a-backtest-input.v1.schema.json --spec=draft2020 -c ajv-formats
      - name: CLI rejects unsupported schema version
        run: |
          printf '{"schema_version":"9.9.9"}\n' > build/invalid-schema.json
          if build/plan_a_backtest build/invalid-schema.json build/invalid-schema-output.json 2>build/invalid-schema.err; then
            echo "CLI unexpectedly accepted unsupported schema"
            exit 1
          fi
          grep -Fq 'SCHEMA_VERSION_UNSUPPORTED' build/invalid-schema.err
      - name: Stage 8 integrity guards
        run: |
          grep -Fq 'PLAN_A_LRT' cpp/include/cfss/backtest.hpp
          grep -Fq 'PLAN_A_NMT' cpp/include/cfss/backtest.hpp
          grep -Fq 'AMBIGUOUS_STOP_FIRST' cpp/include/cfss/backtest.hpp
          grep -Fq 'UNAVAILABLE' cpp/include/cfss/backtest.hpp
          grep -Fq 'trade_execution_allowed' cpp/include/cfss/backtest.hpp
          grep -Fq 'STOP_GAP' cpp/include/cfss/backtest.hpp
          echo "STAGE8_PLAN_A_INTEGRITY_GUARDS_PASS"
