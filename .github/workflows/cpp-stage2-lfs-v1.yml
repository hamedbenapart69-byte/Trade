name: C++ Stage 2 LFS v1 Contract

on:
  push:
    branches: [feat/cpp-stage2-lfs-v1]
    paths:
      - "cpp/**"
      - "docs/evidence/stage2-lfs-slrp-report.md"
      - "docs/evidence/publish-stage2-telegram-report.txt"
      - ".github/workflows/cpp-stage2-lfs-v1.yml"
  pull_request:
    branches: [feat/cpp-stage1-clean]
    paths:
      - "cpp/**"
      - "docs/evidence/stage2-lfs-slrp-report.md"
      - ".github/workflows/cpp-stage2-lfs-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpp-stage2-lfs-v1-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  lfs-v1-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install free runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libcurl4-openssl-dev nlohmann-json3-dev libssl-dev jq
      - name: Configure C++ build
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build all C++ targets
        run: cmake --build build --parallel 2
      - name: Collect real OKX BTC and liquid altcoin sample
        run: |
          mkdir -p stage2-evidence
          ./build/market_pipeline --collect-okx 2 2 \
            stage2-evidence/l1-market-data.v1.json \
            stage2-evidence/l2-status.v1.json
          sha256sum stage2-evidence/l1-market-data.v1.json stage2-evidence/l2-status.v1.json
      - name: Execute LFS v1 against real L1 inputs
        run: |
          ./build/lfs_v1_probe stage2-evidence/l1-market-data.v1.json stage2-evidence/lfs-v1.json
          jq -r '.instruments[] | [.symbol, .status, (.components[] | (.id + "=" + .raw_input + ":" + .data_class))] | @tsv' stage2-evidence/lfs-v1.json
          sha256sum stage2-evidence/lfs-v1.json
      - name: Record LFS component source coverage
        run: |
          jq -r '.instruments[] | [
            .unified_symbol,
            (if has("orderbook") then "ORDERBOOK_PRESENT" else "ORDERBOOK_UNAVAILABLE" end),
            (if has("long_short") then "LONG_SHORT_PRESENT" else "LONG_SHORT_UNAVAILABLE" end),
            ("FUNDING_ROWS=" + ((.funding | length) | tostring)),
            ("OHLCV_ROWS=" + ((.candles | length) | tostring)),
            ("OI_ROWS=" + ((.open_interest | length) | tostring))
          ] | @tsv' stage2-evidence/l1-market-data.v1.json
      - name: Execute LFS v2 proxy against real OHLCV funding OI and public long-short data
        run: |
          ./build/lfs_v2_probe stage2-evidence/l1-market-data.v1.json stage2-evidence/lfs-v2.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/lfs-v2-proxy.v1.schema.json -d stage2-evidence/lfs-v2.json --all-errors
          jq -r '.instruments[] | [.symbol, .status, .data_class, (.score // "UNAVAILABLE"), ("coverage=" + (.component_coverage.available_scores|tostring) + "/5"), ("long_short_rows=" + (.long_short_rows|tostring))] | @tsv' stage2-evidence/lfs-v2.json
          sha256sum stage2-evidence/lfs-v2.json
      - name: Run unit and LFS v1 contract tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Checkout Telegram receipt state
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[LFS_STAGE2_REPORT]') }}
        uses: actions/checkout@v4
        with:
          ref: signals
          path: signals-state
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare Stage 2 Telegram outbox
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[LFS_STAGE2_REPORT]') }}
        run: |
          mkdir -p signals-state/cpp_runtime
          ./build/lfs_telegram_report --prepare stage2-evidence/lfs-v2.json signals-state/cpp_runtime/lfs_stage2_telegram_outbox.v1.json
      - name: Persist reserved Telegram send before network delivery
        if: ${{ success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[LFS_STAGE2_REPORT]') }}
        run: |
          cd signals-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpp_runtime/lfs_stage2_telegram_outbox.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(stage2): reserve Telegram report delivery"
            git push origin HEAD:signals
          fi
      - name: Send Stage 2 report via C++ Telegram L3
        if: ${{ success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[LFS_STAGE2_REPORT]') }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ./build/lfs_telegram_report --send stage2-evidence/lfs-v2.json signals-state/cpp_runtime/lfs_stage2_telegram_outbox.v1.json
      - name: Persist final Telegram receipt
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[LFS_STAGE2_REPORT]') }}
        run: |
          cd signals-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpp_runtime/lfs_stage2_telegram_outbox.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(stage2): persist Telegram report receipt"
            git push origin HEAD:signals
          fi
      - name: Assert no Actions artifact upload is configured
        run: |
          if grep -qE "^[[:space:]]*-[[:space:]]*uses:[[:space:]]*actions/upload-artifact" .github/workflows/cpp-stage2-lfs-v1.yml; then
            echo "Unexpected Actions artifact upload dependency detected"
            exit 1
          fi
          echo "NO_ACTIONS_ARTIFACT_UPLOAD"
