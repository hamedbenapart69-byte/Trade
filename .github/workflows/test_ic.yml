name: Simple Data Mining - Volume Rank IC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ic:
    name: Calculate Volume Rank IC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install permitted dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests

      - name: Run simple IC test
        run: python research/test_ic.py
