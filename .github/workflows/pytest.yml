name: Pytest
on:
  push:
    branches: [main, feat/telegram-dual-destination]
    paths:
      - "pyproject.toml"
      - "signal_autopilot/**"
      - ".github/workflows/pytest.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "signal_autopilot/**"
      - ".github/workflows/pytest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/signal_autopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r signal_autopilot/requirements.txt
          python -m pip install pytest
      - name: Verify repository package import roots
        run: python -c "import app, app.integrations, app.workflow_schemas, modules.lrt15m_engine; print('REPOSITORY_IMPORT_PATHS_OK', app.__file__)"
      - name: Run requested pytest command
        run: python -m pytest -v --tb=short
