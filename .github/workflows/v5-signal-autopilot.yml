name: V5 Futures Signal Autopilot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send a Telegram test message instead of signal notifications
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/**"
      - "web/**"
      - "tests/**"
      - "requirements.txt"
      - "notifier.py"
      - "TELEGRAM_SETUP.md"
      - ".github/workflows/v5-signal-autopilot.yml"
      - ".github/workflows/static.yml"

concurrency:
  group: v5-signal-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan-and-build:
    if: github.event_name != 'workflow_dispatch' || inputs.test_telegram != true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore persistent paper-trading state
        id: state
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ runner.os }}-v5-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-v5-state-

      - name: Report state continuity
        shell: bash
        run: |
          mkdir -p data
          if [ -s data/control.db ]; then
            echo "V5_STATE_RESTORED=true" >> "$GITHUB_ENV"
            echo "Persistent paper state restored."
          else
            echo "V5_STATE_RESTORED=false" >> "$GITHUB_ENV"
            echo "No previous cache found; paper tracking starts with an empty state."
          fi

      - name: Run unit tests before scanning
        env:
          CONTROL_API_TOKEN: ci-control-token-which-is-long-enough-123456
          WORKER_API_TOKEN: ci-worker-token-which-is-long-enough-123456
          CONTROL_DB_PATH: ${{ runner.temp }}/v5-ci-tests.db
        run: python -m unittest discover -s tests -v

      - name: Remove isolated test database
        if: always()
        env:
          CONTROL_DB_PATH: ${{ runner.temp }}/v5-ci-tests.db
        run: rm -f "$CONTROL_DB_PATH" "$CONTROL_DB_PATH-wal" "$CONTROL_DB_PATH-shm"

      - name: Run live V5 market scan
        env:
          V5_DATA_PROVIDER: okx
          CONTROL_DB_PATH: ${{ github.workspace }}/data/control.db
        shell: bash
        run: |
          set +e
          python scripts/v5_live_scan.py
          scan_exit=$?
          set -e
          if [ "$scan_exit" -ne 0 ] && [ "$scan_exit" -ne 2 ]; then
            echo "Unexpected scanner exit code: $scan_exit"
            exit "$scan_exit"
          fi
          test -s artifacts/v5_live_scan.json

      - name: Build validated public dashboard files
        run: |
          python scripts/prepare_pages.py
          python -m json.tool site/latest.json > /dev/null
          test -s site/index.html
          test -s site/latest.json

      - name: Publish isolated signals branch
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://your-project.pages.dev' }}
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin +refs/heads/signals:refs/remotes/origin/signals
          git worktree add /tmp/signals-public refs/remotes/origin/signals
          python scripts/publish_signals.py --source site/latest.json --output-dir /tmp/signals-public
          git -C /tmp/signals-public add signals.json history.csv
          if ! git -C /tmp/signals-public diff --cached --quiet; then
            git -C /tmp/signals-public commit -m "data: publish latest V5 scan"
            for attempt in 1 2 3; do
              git -C /tmp/signals-public fetch origin +refs/heads/signals:refs/remotes/origin/signals
              if ! git -C /tmp/signals-public rebase refs/remotes/origin/signals; then
                git -C /tmp/signals-public rebase --abort || true
                echo "Rebase conflict while publishing signals (attempt $attempt)."
                sleep $((attempt * 2))
                continue
              fi
              if git -C /tmp/signals-public push origin HEAD:refs/heads/signals; then
                echo "Signals branch updated successfully."
                exit 0
              fi
              echo "Push retry $attempt/3."
              sleep $((attempt * 2))
            done
            echo "Unable to publish signals branch after 3 attempts."
            exit 1
          else
            echo "No changes in public signal payload."
          fi

      - name: Send Telegram signal notifications
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://your-project.pages.dev' }}
        run: python notifier.py

      - name: Checkpoint SQLite state before cache save
        env:
          CONTROL_DB_PATH: ${{ github.workspace }}/data/control.db
        run: |
          python -c 'from app import store; c=store.connect(); c.execute("PRAGMA wal_checkpoint(TRUNCATE)"); c.close()'
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-signal-dashboard
          path: site/
          if-no-files-found: error
          retention-days: 7

      - name: Upload raw scan audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: v5-scan-audit
          path: artifacts/v5_live_scan.json
          if-no-files-found: error
          retention-days: 3

  telegram-test:
    if: github.event_name == 'workflow_dispatch' && inputs.test_telegram == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Send Telegram test message
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://your-project.pages.dev' }}
        run: python notifier.py --test

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: scan-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "GitHub Pages is not enabled; attempting the free workflow-based setup."
            create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
            verify_code=$(curl -sS -o /tmp/pages-verify.json -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
            if [ "$create_code" = "201" ] || [ "$verify_code" = "200" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages workflow source is enabled."
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Pages could not be enabled automatically (create HTTP $create_code). The verified dashboard artifact remains available for 7 days."
              cat /tmp/pages-create.json
            fi
          else
            echo "Unexpected Pages API status: $code"
            cat /tmp/pages.json
            exit 1
          fi

      - name: Download dashboard artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: v5-signal-dashboard
          path: site

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy dashboard
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
