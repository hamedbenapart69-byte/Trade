# Legacy compatibility workflow only. V21 production compute is C++.
# This workflow is manual-only and always dry-run; it must never send Telegram messages.
name: Legacy Python MVP — Manual Dry Run Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-python-manual-dry-run
  cancel-in-progress: false

jobs:
  legacy-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python (legacy validation only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test legacy calculations and fail-closed controls
        run: python -m unittest discover -s tests -p "test_send_signals.py" -v

      - name: Generate local dry-run artifacts (Telegram disabled)
        run: python send_signals.py --dry-run

      - name: Upload dry-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-python-dry-run-output
          path: |
            artifacts/signals.json
            artifacts/telegram_message.txt
          if-no-files-found: warn
          retention-days: 7
