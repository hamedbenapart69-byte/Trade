name: Stage 1a Binance Vision Data Validation

on:
  push:
    branches: [stage1a-binance-vision-data-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1a-data-validation-v2
  cancel-in-progress: false

jobs:
  stage1a:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signal_autopilot/requirements.txt
      - name: Install minimal Stage 1a dependency
        run: pip install "httpx>=0.27,<1.0"
      - name: Run Stage 1a unit tests
        working-directory: signal_autopilot
        run: python -m unittest tests.test_stage1a_provider -v
      - name: Run live Binance Vision and funding provider probe
        working-directory: signal_autopilot
        run: python scripts/run_stage1a_provider_probe.py
      - name: Upload Stage 1a evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1a-provider-report
          path: signal_autopilot/data/stage1a_provider_report.json
          if-no-files-found: warn
          retention-days: 30
