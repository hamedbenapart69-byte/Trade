name: C++ V21 Stage 1 Live Vertical Slice

on:
  push:
    branches: [main, feat/cpp-stage1-clean, v21/stage0-accepted-stage1-foundation]
    paths:
      - "docs/evidence/run-cpp-stage1-live*.txt"
      - "docs/evidence/run-telegram-inbound-test*.txt"
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches: [main]
    paths:
      - "cpp/**"
      - "contracts/**"
      - ".github/workflows/cpp-stage1-live.yml"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Number of non-BTC USDT perpetuals; BTC is added separately"
        required: true
        default: "100"
        type: choice
        options: ["1", "5", "10", "25", "50", "100"]
      years:
        description: "Completed 1h OHLCV history"
        required: true
        default: "2"
        type: choice
        options: ["1", "2"]
      run_inbound_test:
        description: "Run the controlled Telegram inbound test after sending /status to the bot"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # همهٔ اجراها یک signals branch مشترک را می‌نویسند؛ اجرای هم‌زمان ممنوع است.
  group: cpp-only-stage1-live
  cancel-in-progress: false

jobs:
  cpp-l1-l2:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libcurl4-openssl-dev nlohmann-json3-dev libssl-dev

      - name: Record toolchain
        run: |
          cmake --version
          g++ --version
          pkg-config --modversion libcurl openssl

      - name: Configure and build C++20
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Run C++ unit and contract tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Record immutable C++ build identity
        run: |
          BUILD_ID=$(sha256sum build/market_pipeline | awk '{print $1}')
          echo "CFSS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Checkout persistent signals branch
        id: checkout_signals
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: signals
          path: signals-state
          fetch-depth: 0
          persist-credentials: true
      - name: Snapshot Telegram inbound baseline before controlled polling
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_inbound_test) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_TEST]') || contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_REPLAY_TEST]'))) }}
        run: |
          mkdir -p artifacts
          if [ -s signals-state/cpp_runtime/telegram_inbound.v1.json ]; then
            PREVIOUS_UPDATE_ID=$(jq -r '.last_update_id // 0' signals-state/cpp_runtime/telegram_inbound.v1.json)
          else
            PREVIOUS_UPDATE_ID=0
          fi
          printf '%s\n' "$PREVIOUS_UPDATE_ID" > artifacts/telegram-inbound-previous-update-id.txt
          # Fail immediately if the persisted baseline is not valid JSON integer input for jq --argjson.
          jq -n --argjson previous "$(cat artifacts/telegram-inbound-previous-update-id.txt)" '$previous' >/dev/null
          echo "TELEGRAM_INBOUND_BASELINE_UPDATE_ID=$PREVIOUS_UPDATE_ID"

      - name: Restore shared market-data cache
        uses: actions/cache@v4
        with:
          path: |
            shared-cache/market_data_cache.v1.json
            shared-cache/crypto-universe.v1.json
          key: cfss-market-cache-${{ github.run_id }}
          restore-keys: |
            cfss-market-cache-

      - name: Collect real OKX L1 data and compute C10 states in C++
        env:
          SYMBOLS: ${{ inputs.symbols || (github.event_name == 'schedule' && '100' || '2') }}
          YEARS: ${{ inputs.years || '2' }}
        run: |
          mkdir -p artifacts shared-cache
          # Stage 1 must not inherit symbol candidates from rejected legacy strategy state.
          printf '%s\n' '[]' > artifacts/pending-symbols.v1.json
          ./build/market_pipeline --collect-okx "$SYMBOLS" "$YEARS" \
            artifacts/l1-market-data.v1.json artifacts/l2-status.v1.json \
            shared-cache/crypto-universe.v1.json \
            shared-cache/market_data_cache.v1.json \
            artifacts/pending-symbols.v1.json
          cp artifacts/crypto-universe.v1.json shared-cache/crypto-universe.v1.json
          sha256sum artifacts/l1-market-data.v1.json artifacts/l2-status.v1.json

      - name: Validate L1 against the versioned JSON Schema
        run: |
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/l1-market-data.v1.schema.json -d artifacts/l1-market-data.v1.json --all-errors
      - name: Validate verified crypto universe
        run: |
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/crypto-universe.v1.schema.json -d artifacts/crypto-universe.v1.json --all-errors

      - name: Validate run manifest
        run: |
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/run-manifest.v2.schema.json -d artifacts/run-manifest.v2.json --all-errors

      - name: Validate L2 against the versioned JSON Schema
        run: |
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/l2-status.v1.schema.json -d artifacts/l2-status.v1.json --all-errors

      - name: C++ artifact integrity and state coverage summary
        run: |
          test -s artifacts/l1-market-data.v1.json
          test -s artifacts/l2-status.v1.json
          grep -q '"artifact_sha256"' artifacts/l2-status.v1.json
          grep -q '"NO_QUALIFIED_SETUP"\|"MARKET_DATA_DEGRADED"' artifacts/l2-status.v1.json
          echo "CPP_L1_L2_ARTIFACTS_PRESENT"


      - name: Real Telegram outbound through C++ L3
        if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_REPLAY_TEST]')) }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          mkdir -p signals-state/cpp_runtime
          ./build/telegram_delivery artifacts/l2-status.v1.json \
            signals-state/cpp_runtime/telegram_outbox.v1.json artifacts/run-manifest.v2.json

      - name: Controlled Telegram inbound receive through C++ L3
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_inbound_test) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_TEST]') || contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_REPLAY_TEST]'))) }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for attempt in $(seq 1 12); do
            echo "CPP_TELEGRAM_INBOUND_POLL=$attempt/12"
            ./build/telegram_inbound signals-state/cpp_runtime/telegram_inbound.v1.json artifacts/run-manifest.v2.json
            sleep 5
          done
          test -s signals-state/cpp_runtime/telegram_inbound.v1.json
          grep -Eq '"status": "PROCESSED"' signals-state/cpp_runtime/telegram_inbound.v1.json
          echo "CPP_TELEGRAM_INBOUND_PROCESSED"

      - name: Snapshot exact processed update before replay
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_inbound_test) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_TEST]') || contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_REPLAY_TEST]'))) }}
        run: |
          PREVIOUS_UPDATE_ID=$(cat artifacts/telegram-inbound-previous-update-id.txt)
          UPDATE_ID=$(jq -r --argjson previous "$PREVIOUS_UPDATE_ID" '
            [.processed_updates | to_entries[] |
              select((.key | tonumber) > $previous) |
              select(.value.status == "PROCESSED" and
                     .value.reply_status == "DELIVERED" and
                     (.value.reply_message_id | type) == "number" and
                     .value.reply_message_id > 0) |
              (.key | tonumber)] | max // empty
          ' signals-state/cpp_runtime/telegram_inbound.v1.json)
          REPLAY_SOURCE="NEWLY_RECEIVED"
          if [ -z "$UPDATE_ID" ]; then
            echo "No new authorized /status update; searching persisted receipts for a previously verified real inbound."
            mapfile -t VERIFIED_RECEIPTS < <(
              jq -r 'select(.telegram_receive_test_status == "RECEIVED_PROCESSED") | .telegram_last_update_id // empty' \
                signals-state/cpp_runtime/run-manifest-*.json | sort -n -u
            )
            for candidate in "${VERIFIED_RECEIPTS[@]}"; do
              if jq -e --arg key "$candidate" '
                .processed_updates[$key].status == "PROCESSED" and
                .processed_updates[$key].reply_status == "DELIVERED" and
                (.processed_updates[$key].reply_message_id | type) == "number" and
                .processed_updates[$key].reply_message_id > 0
              ' signals-state/cpp_runtime/telegram_inbound.v1.json >/dev/null; then
                UPDATE_ID="$candidate"
                REPLAY_SOURCE="PRIOR_VERIFIED_RECEIPT"
              fi
            done
          fi
          if [ -z "$UPDATE_ID" ]; then
            echo "TELEGRAM_INBOUND_REPLAY_SNAPSHOT_FAIL: no new update or persisted receipt backed by a prior RECEIVED_PROCESSED manifest"
            exit 1
          fi
          jq --arg key "$UPDATE_ID" '.processed_updates[$key] | {status, reply_status, reply_message_id}' \
            signals-state/cpp_runtime/telegram_inbound.v1.json > artifacts/inbound-replay-before.json
          test "$(jq -r .status artifacts/inbound-replay-before.json)" = "PROCESSED"
          test "$(jq -r .reply_status artifacts/inbound-replay-before.json)" = "DELIVERED"
          test "$(jq -r .reply_message_id artifacts/inbound-replay-before.json)" -gt 0
          printf '%s\n' "$UPDATE_ID" > artifacts/inbound-replay-update-id.txt
          printf '%s\n' "$REPLAY_SOURCE" > artifacts/inbound-replay-source.txt
          echo "TELEGRAM_EXACT_REPLAY_SOURCE=$REPLAY_SOURCE update_id=$UPDATE_ID"
      - name: Replay the exact processed Telegram update through C++ L3
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_inbound_test) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_TEST]') || contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_REPLAY_TEST]'))) }}
        run: |
          UPDATE_ID=$(cat artifacts/inbound-replay-update-id.txt)
          ./build/telegram_inbound --replay-update "$UPDATE_ID" \
            signals-state/cpp_runtime/telegram_inbound.v1.json artifacts/run-manifest.v2.json

      - name: Verify exact-update replay did not send a second reply
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_inbound_test) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_TEST]') || contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_REPLAY_TEST]'))) }}
        run: |
          UPDATE_ID=$(cat artifacts/inbound-replay-update-id.txt)
          KEY="$UPDATE_ID"
          BEFORE_REPLY_ID=$(jq -r .reply_message_id artifacts/inbound-replay-before.json)
          AFTER_REPLY_ID=$(jq -r --arg key "$KEY" '.processed_updates[$key].reply_message_id' signals-state/cpp_runtime/telegram_inbound.v1.json)
          AFTER_STATUS=$(jq -r --arg key "$KEY" '.processed_updates[$key].status' signals-state/cpp_runtime/telegram_inbound.v1.json)
          AFTER_REPLY_STATUS=$(jq -r --arg key "$KEY" '.processed_updates[$key].reply_status' signals-state/cpp_runtime/telegram_inbound.v1.json)
          test "$AFTER_STATUS" = "PROCESSED"
          test "$AFTER_REPLY_STATUS" = "DELIVERED"
          test "$AFTER_REPLY_ID" = "$BEFORE_REPLY_ID"
          test "$(jq -r .telegram_replay_test_status artifacts/run-manifest.v2.json)" = "PASS"
          test "$(jq -r .telegram_replay_test_update_id artifacts/run-manifest.v2.json)" = "$UPDATE_ID"
          echo "CPP_TELEGRAM_INBOUND_EXACT_REPLAY_DEDUPE_PASS update_id=$UPDATE_ID reply_message_id=$AFTER_REPLY_ID"

      - name: Record inbound test not requested
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.run_inbound_test) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_TEST]') || contains(github.event.head_commit.message, '[TELEGRAM_INBOUND_REPLAY_TEST]'))) ) }}
        run: |
          mkdir -p artifacts
          printf '{"status":"NOT_REQUESTED","reason":"Controlled inbound test requires an actual user message to the bot"}\n' > artifacts/telegram-inbound-test-status.json

      - name: Validate required signals performance coverage and system-status artifacts
        run: |
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/signals.v1.schema.json -d artifacts/signals.json --all-errors
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/performance.v1.schema.json -d artifacts/performance.json --all-errors
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/coverage.v1.schema.json -d artifacts/coverage.json --all-errors
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/system-status.v1.schema.json -d artifacts/system_status.json --all-errors

      - name: Validate history CSV header and row count
        run: |
          EXPECTED_HEADER="timestamp_utc,run_id,scan_id,instrument_id,symbol,state,reason_code,data_quality,confidence_status,actionable,latest_candle_timestamp_ms"
          test "$(head -n 1 artifacts/history.csv)" = "$EXPECTED_HEADER"
          CSV_ROWS=$(wc -l < artifacts/history.csv)
          L1_ROWS=$(jq '.instruments | length' artifacts/l1-market-data.v1.json)
          test "$CSV_ROWS" -eq "$((L1_ROWS + 1))"
          echo "HISTORY_CSV_ROWS=$((CSV_ROWS - 1))"

      - name: Validate V21.0 run manifest
        run: |
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s contracts/run-manifest.v2.schema.json -d artifacts/run-manifest.v2.json --all-errors

      - name: Persist run manifest and Telegram receipts
        if: always() && github.event_name != 'pull_request' && steps.checkout_signals.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -s artifacts/run-manifest.v2.json ]; then
            echo "STAGE1_MANIFEST_NOT_CREATED"
            exit 0
          fi
          RUN_ID=$(jq -r .run_id artifacts/run-manifest.v2.json)
          mkdir -p signals-state/cpp_runtime
          cp artifacts/run-manifest.v2.json "signals-state/cpp_runtime/run-manifest-${RUN_ID}.json"
          for pair in \
            "crypto-universe.v1.json:crypto_universe.v1.json" \
            "l2-status.v1.json:l2-status-${RUN_ID}.json" \
            "provider-health.v1.json:provider-health-${RUN_ID}.json" \
            "fear-greed.v1.json:fear-greed-${RUN_ID}.json" \
            "signals.json:signals-${RUN_ID}.json" \
            "history.csv:history-${RUN_ID}.csv" \
            "performance.json:performance-${RUN_ID}.json" \
            "coverage.json:coverage-${RUN_ID}.json" \
            "system_status.json:system-status-${RUN_ID}.json"; do
            src="${pair%%:*}"
            dst="${pair#*:}"
            if [ -s "artifacts/$src" ]; then cp "artifacts/$src" "signals-state/cpp_runtime/$dst"; fi
          done

      - name: Persist Telegram delivery and inbound receipts
        id: persist_telegram_state
        if: always() && github.event_name != 'pull_request' && steps.checkout_signals.outcome == 'success'
        working-directory: signals-state
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d cpp_runtime ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cpp_runtime/
          if git diff --cached --quiet; then
            echo "CPP_TELEGRAM_STATE_UNCHANGED"
            exit 0
          fi
          git commit -m "state: persist C++ only Stage 1 Telegram receipts [skip ci]"
          git fetch origin refs/heads/signals:refs/remotes/origin/signals
          git rebase refs/remotes/origin/signals
          git push origin HEAD:refs/heads/signals

      - name: Assert no Actions artifact storage is used
        if: always()
        run: |
          echo "ACTIONS_ARTIFACT_UPLOAD_DISABLED=true"
          echo "COMPACT_EVIDENCE_PERSISTED_ON_SIGNALS_BRANCH=true"

      - name: Verify signals branch persistence
        id: verify_signals_persist
        if: always() && github.event_name != 'pull_request' && steps.checkout_signals.outcome == 'success' && steps.persist_telegram_state.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(jq -r '.run_id // empty' artifacts/run-manifest.v2.json 2>/dev/null || true)
          test -n "$RUN_ID"
          git -C signals-state fetch origin refs/heads/signals:refs/remotes/origin/signals
          MANIFEST_PATH="cpp_runtime/run-manifest-${RUN_ID}.json"
          git -C signals-state cat-file -e "origin/signals:$MANIFEST_PATH"
          git -C signals-state show "origin/signals:$MANIFEST_PATH" > artifacts/signals-branch-current-manifest.json
          cmp artifacts/run-manifest.v2.json artifacts/signals-branch-current-manifest.json
          git -C signals-state cat-file -e "origin/signals:cpp_runtime/telegram_outbox.v1.json"
          git -C signals-state show "origin/signals:cpp_runtime/telegram_outbox.v1.json" > artifacts/signals-branch-telegram-outbox.v1.json
          SCAN_ID=$(jq -r '.scan_id' artifacts/run-manifest.v2.json)
          jq -e --arg scan "$SCAN_ID" '
            [.messages | to_entries[] | select(.key | startswith($scan + ":status:"))] as $messages |
            ($messages | length) > 0 and
            all($messages[]; .value.status == "DELIVERED" and
                (.value.telegram_message_id | type) == "number" and
                .value.telegram_message_id > 0)
          ' artifacts/signals-branch-telegram-outbox.v1.json >/dev/null
          for path in             "l2-status-${RUN_ID}.json"             "provider-health-${RUN_ID}.json"             "fear-greed-${RUN_ID}.json"             "crypto_universe.v1.json"             "signals-${RUN_ID}.json"             "history-${RUN_ID}.csv"             "performance-${RUN_ID}.json"             "coverage-${RUN_ID}.json"             "system-status-${RUN_ID}.json"; do
            git -C signals-state cat-file -e "origin/signals:cpp_runtime/$path"
          done
          echo "SIGNALS_BRANCH_REMOTE_PERSISTENCE_PASS run_id=$RUN_ID"

      - name: Enforce V21 Stage 1 acceptance gate
        if: always() && github.event_name != 'pull_request' && steps.checkout_signals.outcome == 'success' && steps.verify_signals_persist.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(jq -r '.run_id // empty' artifacts/run-manifest.v2.json 2>/dev/null || true)
          CURRENT="signals-state/cpp_runtime/run-manifest-${RUN_ID}.json"
          if [ -z "$RUN_ID" ] || [ ! -s "$CURRENT" ]; then
            echo "STAGE1_ACCEPTANCE_BLOCKED: current run manifest missing"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "STAGE1_ACCEPTANCE_BLOCKED: only main-branch runs can establish production acceptance"
            exit 1
          fi
          jq -e '
            (.run_status == "L1_L2_L3_PASS" or .run_status == "STAGE1_CONTROLLED_ACCEPTANCE_PASS") and
            .telegram_send_status == "DELIVERED" and
            (.telegram_message_ids | length > 0) and
            (.active_strategy_engines | length == 0) and
            (.rejected_strategy_families == ["LRT", "NMT", "VTM"])
          ' "$CURRENT" >/dev/null
          RUN_NUMBER="$GITHUB_RUN_NUMBER"
          [[ "$RUN_NUMBER" =~ ^[0-9]+$ ]] && [ "$RUN_NUMBER" -gt 1 ]
          mapfile -t manifests < <(find signals-state/cpp_runtime -maxdepth 1 -type f -name 'run-manifest-*.json' | sort)
          test "${#manifests[@]}" -gt 0
          jq -s '
            [.[] | select((.workflow_run_number | type) == "number")] |
            sort_by(.workflow_run_number) | .[-2:]
          ' "${manifests[@]}" > artifacts/stage1-acceptance-last-two.json
          VALID_COUNT=$(jq 'length' artifacts/stage1-acceptance-last-two.json)
          if [ "$VALID_COUNT" -lt 2 ]; then
            echo "STAGE1_ACCEPTANCE_PENDING: ${VALID_COUNT}/2 consecutive Stage 1 workflow runs have manifests"
            exit 1
          fi
          jq -e --arg sha "$GITHUB_SHA" --argjson current "$RUN_NUMBER" '
            length == 2 and
            .[0].workflow_run_number == ($current - 1) and
            .[1].workflow_run_number == $current and
            all(.[]; 
              .repository_commit == $sha and
              .branch == "main" and
              (.run_status == "L1_L2_L3_PASS" or .run_status == "STAGE1_CONTROLLED_ACCEPTANCE_PASS") and
              .telegram_send_status == "DELIVERED" and
              (.telegram_message_ids | length > 0) and
              (.active_strategy_engines | length == 0) and
              (.rejected_strategy_families == ["LRT", "NMT", "VTM"]) and
              .document_version == "V21.0" and
              (.dataset_hash | type == "string") and
              (.dataset_hash | length > 0) and
              (.artifact_manifest.l1_market_data.sha256 | type == "string") and
              (.artifact_manifest.l1_market_data.sha256 | length > 0) and
              .artifact_manifest.l2_status.retained_in_signals_branch == true and
              .artifact_manifest.provider_health.retained_in_signals_branch == true and
              .artifact_manifest.crypto_universe.retained_in_signals_branch == true and
              .artifact_manifest.signals.retained_in_signals_branch == true and
              .artifact_manifest.history.retained_in_signals_branch == true and
              .artifact_manifest.performance.retained_in_signals_branch == true and
              .artifact_manifest.coverage.retained_in_signals_branch == true and
              .artifact_manifest.system_status.retained_in_signals_branch == true
            )
          ' artifacts/stage1-acceptance-last-two.json >/dev/null
          DISTINCT_RUN_IDS=$(jq '[.[].run_id] | unique | length' artifacts/stage1-acceptance-last-two.json)
          if [ "$DISTINCT_RUN_IDS" -ne 2 ]; then
            echo "STAGE1_ACCEPTANCE_FAIL: run IDs are not distinct"
            exit 1
          fi
          while IFS= read -r scan_id; do
            jq -e --arg scan "$scan_id" '
              [.messages | to_entries[] | select(.key | startswith($scan + ":status:"))] as $messages |
              ($messages | length) > 0 and
              all($messages[]; .value.status == "DELIVERED" and
                  (.value.telegram_message_id | type) == "number" and
                  .value.telegram_message_id > 0)
            ' artifacts/signals-branch-telegram-outbox.v1.json >/dev/null
          done < <(jq -r '.[].scan_id' artifacts/stage1-acceptance-last-two.json)
          INBOUND_COUNT=$(jq '[.[] | select(
            .telegram_receive_test_status == "RECEIVED_PROCESSED" and
            .telegram_replay_test_status == "PASS" and
            .run_status == "STAGE1_CONTROLLED_ACCEPTANCE_PASS"
          )] | length' artifacts/stage1-acceptance-last-two.json)
          if [ "$INBOUND_COUNT" -lt 1 ]; then
            echo "STAGE1_ACCEPTANCE_PENDING: one of the last two runs must prove /status receive and exact-update replay"
            exit 1
          fi
          git -C signals-state show "origin/signals:cpp_runtime/telegram_inbound.v1.json" > artifacts/signals-branch-telegram-inbound.v1.json
          while IFS= read -r update_id; do
            jq -e --arg key "$update_id" '
              .processed_updates[$key].status == "PROCESSED" and
              .processed_updates[$key].reply_status == "DELIVERED" and
              (.processed_updates[$key].reply_message_id | type) == "number" and
              .processed_updates[$key].reply_message_id > 0
            ' artifacts/signals-branch-telegram-inbound.v1.json >/dev/null
          done < <(jq -r '.[] | select(
            .telegram_receive_test_status == "RECEIVED_PROCESSED" and
            .telegram_replay_test_status == "PASS" and
            .run_status == "STAGE1_CONTROLLED_ACCEPTANCE_PASS"
          ) | .telegram_replay_test_update_id' artifacts/stage1-acceptance-last-two.json)
          echo "STAGE1_ACCEPTANCE_GATE_PASS revision=$GITHUB_SHA consecutive_runs=$VALID_COUNT inbound_replay_runs=$INBOUND_COUNT"
